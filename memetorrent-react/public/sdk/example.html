<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MT Play SDK example</title>
  <style>
    html, body { margin: 0; height: 100%; background: #04140c; color: #e8fff4; font-family: system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; }
    button { min-height: 48px; padding: 10px 18px; border: 0; border-radius: 999px; background: #19d37e; color: #04140c; font-weight: 800; cursor: pointer; }
    #score { font-size: 64px; font-weight: 900; color: #19d37e; }
    #log { font-size: 13px; opacity: .7; text-align: center; max-width: 28rem; }
  </style>
</head>
<body>
  <main>
    <p>Tap the board. Score posts when you hit Stop.</p>
    <div id="score">0</div>
    <button type="button" id="hit">Tap</button>
    <button type="button" id="stop">Stop &amp; post</button>
    <button type="button" id="wallet">Ask play-bar wallet</button>
    <p id="log">SDK loading…</p>
  </main>
  <script src="/sdk/mt-play.js"></script>
  <script>
    const mt = MTPlay.init({ gameId: 'sdk-demo' });
    const log = document.getElementById('log');
    let n = 0;
    function say(t) { log.textContent = t; }
    say('framed=' + mt.inPlayShell() + ' · v' + mt.version);
    mt.on('wallet', (a) => say('wallet ' + a.slice(0, 4) + '…' + a.slice(-4)));
    mt.on('pause', () => say('paused — stop audio here'));
    mt.on('resume', () => say('resume'));
    mt.me().then((d) => { if (d.ok && d.user) say('signed in @' + d.user.username); });
    document.getElementById('hit').onclick = () => { n += 1; document.getElementById('score').textContent = n; };
    document.getElementById('stop').onclick = async () => {
      const r = await mt.postScore(n);
      say(r.ok ? 'posted ' + n : (r.error || 'post failed'));
    };
    document.getElementById('wallet').onclick = () => mt.requestWallet('phantom');
  </script>
</body>
</html>
