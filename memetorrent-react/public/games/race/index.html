function loadTelegramScript() {
  return new Promise((resolve) => {
    // Always load the script, regardless of initial context
    console.log("Loading Telegram Web App script...");
    const script = document.createElement("script");
    script.src = "https://telegram.org/js/telegram-web-app.js";

      console.log("Telegram Web App script loaded successfully");

      if (window.Telegram?.WebApp?.initDataUnsafe?.user) {

        console.log("Telegram Web App loaded but no user data yet, waiting...");
        // Poll for user data until available
        const checkInterval = setInterval(() => {
          if (window.Telegram?.WebApp?.initDataUnsafe?.user) {
            telegramUser = window.Telegram.WebApp.initDataUnsafe.user;
            console.log("Telegram user data retrieved after polling:", telegramUser);
            clearInterval(checkInterval);
            resolve(telegramUser);
          }
        }, 500); // Check every 500ms
        // Timeout after 10 seconds to avoid infinite polling
        setTimeout(() => {
          clearInterval(checkInterval);
          console.log("Timed out waiting for Telegram user data");
          resolve(null);
        }, 10000);
      }
    };
    script.onerror = () => {
      console.error("Failed to load Telegram Web App script");
      telegramScriptLoaded = true;
      resolve(null);
    };
    document.head.appendChild(script);
  });
}

function setupMobileControls() {
  if (!isMobile) return;

  const keyStates = {
    38: false, // Up (accelerate)
    40: false, // Down (brake)
    37: false, // Left
    39: false, // Right
    90: false, // Turbo (Z)
    88: false  // Drift (X)
  };

  const buttonKeyMap = {
    accelBtn: 38,   // Up (accelerate)
    brakeBtn: 40,   // Down (brake)
    leftBtn: 37,    // Left
    rightBtn: 39,   // Right
    turboBtn: 90,   // Z (turbo)
    driftBtn: 88    // X (drift/handbrake)
  };

  const gameOverButtonKeyMap = {
    restartBtn: 90, // Maps to Z (restart)
    exitBtn: 27     // Maps to Esc (exit)
  };

  const activeTouches = new Map();

  function updateKeyState(keyCode, isPressed) {
    if (keyCode in keyStates && keyStates[keyCode] !== isPressed) {
      keyStates[keyCode] = isPressed;
      const event = { keyCode };
      if (isPressed) {
        race.keyDown(event);
      } else {
        race.keyUp(event);
      }
    } else if (keyCode === 90 || keyCode === 27) {
      // For game-over buttons, simulate keyUp on touch end
      if (!isPressed) {
        const event = { keyCode };
        race.keyUp(event);
      }
    }
  }

  // Handle gameplay buttons
  Object.keys(buttonKeyMap).forEach(buttonId => {
    const button = document.getElementById(buttonId);

    button.addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (navigator.vibrate) navigator.vibrate(50);
      button.classList.add("touched");
      const touchId = e.changedTouches[0].identifier;
      activeTouches.set(touchId, buttonId);
      const keyCode = buttonKeyMap[buttonId];
      updateKeyState(keyCode, true);
    });

    button.addEventListener("touchend", (e) => {
      e.preventDefault();
      button.classList.remove("touched");
      const touchId = e.changedTouches[0].identifier;
      if (activeTouches.has(touchId)) {
        const buttonId = activeTouches.get(touchId);
        const keyCode = buttonKeyMap[buttonId];
        updateKeyState(keyCode, false);
        activeTouches.delete(touchId);
      }
    });

    button.addEventListener("touchmove", (e) => e.preventDefault());
  });

  // Handle game-over buttons
  Object.keys(gameOverButtonKeyMap).forEach(buttonId => {
    const button = document.getElementById(buttonId);

    button.addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (navigator.vibrate) navigator.vibrate(50);
      button.classList.add("touched");
      const touchId = e.changedTouches[0].identifier;
      activeTouches.set(touchId, buttonId);
    });

    button.addEventListener("touchend", (e) => {
      e.preventDefault();
      button.classList.remove("touched");
      const touchId = e.changedTouches[0].identifier;
      if (activeTouches.has(touchId)) {
        const buttonId = activeTouches.get(touchId);
        const keyCode = gameOverButtonKeyMap[buttonId];
        updateKeyState(keyCode, false); // Trigger keyUp logic
        activeTouches.delete(touchId);
      }
    });

    button.addEventListener("touchmove", (e) => e.preventDefault());
  });
 }

  if (startScreen.style.display !== "none" && !gameLoopStarted) {

    requestAnimationFrame(frame);
    return;
  }

  gameLoopStarted = true;
  console.log("Starting game loop...");

  try {
    now = l6();
    dt = Math.min(1, (now - last) / 1e3);
    gdt = gdt + dt;
    const controls = document.getElementById("controls");

    n2 = false;
    var t = 1 / 180;
    while (gdt > t) {
      gdt = gdt - t;
      race.update(t);
    }
    v5.c9();

    last = now;

      }
    }
  } catch (error) {
    console.error("Error in frame loop:", error);
  }

  requestAnimationFrame(frame);
}

      box.addEventListener(eventType, function(e) {
        e.preventDefault();
        e.stopPropagation();
        const trackBox = e.currentTarget;
        const trackId = parseInt(trackBox.getAttribute("data-track-id"));
        console.log(`Interaction detected - Event: ${eventType}, Track ID: ${trackId}, Classes: ${trackBox.classList}`);
        if (trackBox.classList.contains("locked")) {
          speak("This track is locked!");
          console.log(`Track ${trackId} is locked and cannot be selected.`);
          return;
        }
        trackBoxes.forEach(b => b.classList.remove("selected"));
        trackBox.classList.add("selected");
        selectedTrackId = trackId;
        console.log(`Track selected: ${tracks[trackId].name} (ID: ${selectedTrackId})`);
        speak(`${tracks[trackId].name} selected`);
        leaderboardData = null;
        updateLeaderboard(true);
      }, { capture: true });
      console.log(`Attached ${eventType} listener to track ${index} (ID: ${box.getAttribute("data-track-id")})`);
    });
  });
}
document.addEventListener("click", function(e) {
  console.log("Document click detected - Target:", e.target, "Classes:", e.target.classList, "ID:", e.target.id);
});
</script>
