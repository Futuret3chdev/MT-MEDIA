<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>MT Puck</title>
  <style>
    html, body { margin: 0; height: 100%; width: 100%; background: #041018; color: #e8fff4; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: fixed; top: 10px; left: 12px; right: 12px; z-index: 5; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
    #score { font-weight: 900; font-size: 22px; letter-spacing: .08em; }
    #score b { color: #38bdf8; }
    #score em { color: #fb7185; font-style: normal; }
    #hint { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 12px; opacity: .7; z-index: 5; pointer-events: none; padding: 0 120px; }
    #start {
      position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, rgba(25,211,126,.2), rgba(4,16,24,.92));
    }
    #start .card { text-align: center; padding: 24px; }
    button { min-height: 46px; padding: 10px 18px; border: 0; border-radius: 999px; background: #19d37e; color: #04140c; font-weight: 900; cursor: pointer; }
    #pad {
      display: none; position: fixed; z-index: 6; left: max(12px, env(safe-area-inset-left));
      bottom: max(14px, env(safe-area-inset-bottom)); width: 118px; height: 118px;
      border-radius: 50%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.22);
      touch-action: none;
    }
    #knob {
      position: absolute; width: 46px; height: 46px; border-radius: 50%; background: #19d37e;
      left: 36px; top: 36px; pointer-events: none;
    }
    #shoot {
      display: none; position: fixed; z-index: 6; right: max(12px, env(safe-area-inset-right));
      bottom: max(18px, env(safe-area-inset-bottom)); width: 86px; height: 86px; border-radius: 50%;
      touch-action: none;
    }
    #shoot:active { filter: brightness(1.15); }
  </style>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js" } }</script>
</head>
<body>
  <div id="hud"><div id="score"><b>YOU 0</b> · <em>CPU 0</em></div><div id="clock">5:00</div></div>
  <div id="hint">Phone: stick to skate, SHOOT to fire · WASD + Space on a keyboard · first to 5</div>
  <div id="start"><div class="card"><h1 style="color:#19d37e">MT PUCK</h1><p>Skate the puck. Crowd goes with you.</p><button id="go" type="button">Drop the puck</button></div></div>
  <div id="pad"><div id="knob"></div></div>
  <button id="shoot" type="button">SHOOT</button>
  <audio id="hit" src="/games/unix/puck/assets/audio/puck_hit.ogg" preload="auto"></audio>
  <audio id="whoosh" src="/games/unix/puck/assets/audio/puck_whoosh.ogg" preload="auto"></audio>
  <audio id="goalSfx" src="/games/unix/puck/assets/audio/goal.ogg" preload="auto"></audio>
  <audio id="crowd" src="/games/unix/puck/assets/audio/crowd.ogg" preload="auto" loop></audio>
  <audio id="theme" src="/games/unix/puck/assets/audio/main_theme.ogg" preload="auto" loop></audio>
  <script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x061018);
scene.fog = new THREE.Fog(0x061018, 28, 70);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 120);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

function viewSize() {
  const vv = window.visualViewport;
  return { w: Math.max(1, vv?.width || innerWidth), h: Math.max(1, vv?.height || innerHeight) };
}
function fit() {
  const { w, h } = viewSize();
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  renderer.domElement.style.width = w + 'px';
  renderer.domElement.style.height = h + 'px';
}
fit();

scene.add(new THREE.HemisphereLight(0xb8d4ff, 0x0a1a12, 0.7));
const sun = new THREE.DirectionalLight(0xfff2d0, 1.1);
sun.position.set(8, 22, 6);
sun.castShadow = true;
scene.add(sun);
const spot = new THREE.SpotLight(0x19d37e, 1.4, 40, 0.7, 0.4);
spot.position.set(0, 16, 0);
scene.add(spot);

const rink = { w: 16, d: 28 };
function ice() {
  const ice = new THREE.Mesh(
    new THREE.BoxGeometry(rink.w, 0.2, rink.d),
    new THREE.MeshPhongMaterial({ color: 0xcfe8f5, shininess: 90 })
  );
  ice.receiveShadow = true;
  scene.add(ice);
  const line = new THREE.Mesh(new THREE.BoxGeometry(rink.w - 0.4, 0.03, 0.12), new THREE.MeshBasicMaterial({ color: 0x19d37e }));
  line.position.y = 0.12;
  scene.add(line);
  const circle = new THREE.Mesh(new THREE.RingGeometry(2.1, 2.25, 32), new THREE.MeshBasicMaterial({ color: 0x19d37e, side: THREE.DoubleSide }));
  circle.rotation.x = -Math.PI / 2;
  circle.position.y = 0.13;
  scene.add(circle);
  const boards = [
    [rink.w / 2 + 0.2, 0.7, 0, 0.4, 1.4, rink.d],
    [-rink.w / 2 - 0.2, 0.7, 0, 0.4, 1.4, rink.d],
    [0, 0.7, rink.d / 2 + 0.2, rink.w + 0.8, 1.4, 0.4],
    [0, 0.7, -rink.d / 2 - 0.2, rink.w + 0.8, 1.4, 0.4],
  ];
  boards.forEach(([x, y, z, a, b, c]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(a, b, c), new THREE.MeshLambertMaterial({ color: 0x0d2a22 }));
    m.position.set(x, y, z);
    scene.add(m);
  });
  // goals
  [[0, 0.6, rink.d / 2 - 0.15, 0x38bdf8], [0, 0.6, -rink.d / 2 + 0.15, 0xfb7185]].forEach(([x, y, z, col]) => {
    const g = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.2, 0.15), new THREE.MeshLambertMaterial({ color: col, transparent: true, opacity: 0.35 }));
    g.position.set(x, y, z);
    scene.add(g);
  });
}
ice();

function crowd() {
  const geo = new THREE.BoxGeometry(0.28, 0.5, 0.28);
  for (let side = -1; side <= 1; side += 2) {
    for (let i = 0; i < 48; i++) {
      const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: new THREE.Color().setHSL(Math.random(), 0.55, 0.45) }));
      m.position.set(side * (rink.w / 2 + 1.1 + Math.random() * 1.4), 1.3 + Math.random() * 1.6, (Math.random() - 0.5) * (rink.d - 2));
      m.userData.baseY = m.position.y;
      m.userData.ph = Math.random() * 6;
      scene.add(m);
      crowd.list.push(m);
    }
  }
}
crowd.list = [];
crowd();

function skater(color, z) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.7, 4, 8), new THREE.MeshLambertMaterial({ color }));
  body.position.y = 0.85;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8), new THREE.MeshLambertMaterial({ color: 0xf1c27d }));
  head.position.y = 1.45;
  const stick = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 1.1), new THREE.MeshLambertMaterial({ color: 0x5c3a21 }));
  stick.position.set(0.35, 0.35, 0.35);
  g.add(body, head, stick);
  g.position.set(0, 0, z);
  g.castShadow = true;
  scene.add(g);
  return { g, vx: 0, vz: 0 };
}
const you = skater(0x38bdf8, 6);
const cpu = skater(0xfb7185, -6);

const puck = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.08, 16), new THREE.MeshPhongMaterial({ color: 0x111, shininess: 80 }));
puck.position.set(0, 0.16, 0);
scene.add(puck);
let puckV = new THREE.Vector3();

const coins = [];
function scatterCoins() {
  coins.forEach((c) => scene.remove(c));
  coins.length = 0;
  for (let i = 0; i < 5; i++) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.05, 12), new THREE.MeshPhongMaterial({ color: 0x19d37e }));
    m.position.set((Math.random() - 0.5) * 10, 0.2, (Math.random() - 0.5) * 18);
    scene.add(m);
    coins.push(m);
  }
}
scatterCoins();

const keys = {};
addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', (e) => { keys[e.code] = false; });
const look = { x: 0, z: 0 };
let useLook = false;
renderer.domElement.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch' || stick.active) return;
  useLook = true;
  const r = renderer.domElement.getBoundingClientRect();
  look.x = ((e.clientX - r.left) / r.width - 0.5) * rink.w * 0.9;
  look.z = -((e.clientY - r.top) / r.height - 0.5) * rink.d * 0.7;
});

const stick = { x: 0, z: 0, active: false };
let shootHeld = false;
const pad = document.getElementById('pad');
const knob = document.getElementById('knob');
const shootBtn = document.getElementById('shoot');

function setPads(on) {
  pad.style.display = on ? 'block' : 'none';
  shootBtn.style.display = on ? 'block' : 'none';
}

function stickFromEvent(e) {
  const r = pad.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top + r.height / 2;
  const max = r.width / 2 - 8;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const mag = Math.hypot(dx, dy) || 1;
  if (mag > max) { dx = dx / mag * max; dy = dy / mag * max; }
  knob.style.left = (r.width / 2 + dx - 23) + 'px';
  knob.style.top = (r.height / 2 + dy - 23) + 'px';
  stick.x = dx / max;
  stick.z = dy / max;
  stick.active = true;
}
function stickReset() {
  stick.x = 0; stick.z = 0; stick.active = false;
  knob.style.left = '36px';
  knob.style.top = '36px';
}
pad.addEventListener('pointerdown', (e) => { pad.setPointerCapture(e.pointerId); stickFromEvent(e); e.preventDefault(); });
pad.addEventListener('pointermove', (e) => { if (stick.active) stickFromEvent(e); });
pad.addEventListener('pointerup', stickReset);
pad.addEventListener('pointercancel', stickReset);
shootBtn.addEventListener('pointerdown', (e) => { shootHeld = true; e.preventDefault(); });
shootBtn.addEventListener('pointerup', () => { shootHeld = false; });
shootBtn.addEventListener('pointercancel', () => { shootHeld = false; });
document.addEventListener('touchmove', (e) => { if (e.target.closest('#pad, #shoot')) e.preventDefault(); }, { passive: false });

let youScore = 0, cpuScore = 0, left = 300, playing = false, last = performance.now();

function sfx(id, vol = 0.4) {
  const a = document.getElementById(id);
  if (!a) return;
  a.volume = vol;
  a.currentTime = 0;
  a.play().catch(() => {});
}

function clampSkater(s) {
  s.g.position.x = Math.max(-rink.w / 2 + 0.7, Math.min(rink.w / 2 - 0.7, s.g.position.x));
  s.g.position.z = Math.max(-rink.d / 2 + 0.7, Math.min(rink.d / 2 - 0.7, s.g.position.z));
}

function resetPuck(dir = 1) {
  puck.position.set(0, 0.16, 0);
  puckV.set((Math.random() - 0.5) * 2, 0, dir * 3);
}

function paintHud() {
  document.getElementById('score').innerHTML = `<b>YOU ${youScore}</b> · <em>CPU ${cpuScore}</em>`;
  const m = Math.floor(left / 60), s = Math.floor(left % 60);
  document.getElementById('clock').textContent = `${m}:${s.toString().padStart(2, '0')}`;
}

function goal(who) {
  if (who === 'you') youScore++; else cpuScore++;
  sfx('goalSfx', 0.55);
  sfx('crowd', 0.35);
  setTimeout(() => { const c = document.getElementById('crowd'); c.pause(); }, 2200);
  paintHud();
  resetPuck(who === 'you' ? -1 : 1);
  if (youScore >= 5 || cpuScore >= 5) {
    playing = false;
    setPads(false);
    document.getElementById('start').style.display = 'flex';
    document.querySelector('#start h1').textContent = youScore > cpuScore ? 'YOU TAKE THE RINK' : 'CPU HOLDS';
    fetch('/api/scores', {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ game_id: 'puck', score: youScore * 100 + Math.max(0, 300 - Math.floor(300 - left)) })
    }).catch(() => {});
  }
}

document.getElementById('go').onclick = () => {
  youScore = 0; cpuScore = 0; left = 300; playing = true;
  you.g.position.set(0, 0, 6);
  cpu.g.position.set(0, 0, -6);
  resetPuck(1);
  scatterCoins();
  document.getElementById('start').style.display = 'none';
  setPads(true);
  const t = document.getElementById('theme');
  t.volume = 0.22; t.play().catch(() => {});
  paintHud();
};

function tick(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  crowd.list.forEach((m) => {
    m.position.y = m.userData.baseY + Math.sin(now / 280 + m.userData.ph) * 0.08;
  });
  if (playing) {
    left = Math.max(0, left - dt);
    if (left <= 0) { playing = false; setPads(false); document.getElementById('start').style.display = 'flex'; }
    const acc = 18;
    if (stick.active) {
      you.vx += stick.x * acc * 1.35 * dt;
      you.vz += stick.z * acc * 1.35 * dt;
    } else {
      if (keys['KeyA'] || keys['ArrowLeft']) you.vx -= acc * dt;
      if (keys['KeyD'] || keys['ArrowRight']) you.vx += acc * dt;
      if (keys['KeyW'] || keys['ArrowUp']) you.vz -= acc * dt;
      if (keys['KeyS'] || keys['ArrowDown']) you.vz += acc * dt;
      if (useLook) {
        you.vx += (look.x - you.g.position.x) * 0.4 * dt;
        you.vz += (look.z - you.g.position.z) * 0.15 * dt;
      }
    }
    you.vx *= 0.9; you.vz *= 0.9;
    you.g.position.x += you.vx * dt;
    you.g.position.z += you.vz * dt;
    clampSkater(you);
    you.g.rotation.y = Math.atan2(you.vx, you.vz);

    const tx = puck.position.x, tz = puck.position.z;
    cpu.g.position.x += (tx - cpu.g.position.x) * 1.6 * dt;
    cpu.g.position.z += (Math.min(-2, tz - 1.4) - cpu.g.position.z) * 1.4 * dt;
    clampSkater(cpu);

    const hit = (sk, power) => {
      const d = sk.g.position.distanceTo(puck.position);
      if (d < 0.85) {
        const dir = puck.position.clone().sub(sk.g.position).setY(0).normalize();
        puckV.add(dir.multiplyScalar(power));
        sfx('hit', 0.35);
      }
    };
    const shooting = keys['Space'] || shootHeld;
    hit(you, shooting ? 18 : 8);
    if (shooting) sfx('whoosh', 0.2);
    hit(cpu, 7);

    puckV.multiplyScalar(0.985);
    puck.position.x += puckV.x * dt;
    puck.position.z += puckV.z * dt;
    if (Math.abs(puck.position.x) > rink.w / 2 - 0.35) { puck.position.x = Math.sign(puck.position.x) * (rink.w / 2 - 0.35); puckV.x *= -0.8; sfx('hit', 0.2); }
    if (Math.abs(puck.position.z) > rink.d / 2 - 0.25) {
      if (Math.abs(puck.position.x) < 1.5) goal(puck.position.z > 0 ? 'cpu' : 'you');
      else { puck.position.z = Math.sign(puck.position.z) * (rink.d / 2 - 0.25); puckV.z *= -0.8; }
    }
    coins.forEach((c) => {
      c.rotation.y += dt * 2;
      if (c.position.distanceTo(you.g.position) < 0.7) {
        c.position.y = -10;
        youScore += 0;
        sfx('whoosh', 0.15);
      }
    });
    paintHud();
  }
  const camTarget = you.g.position.clone();
  camera.position.lerp(new THREE.Vector3(camTarget.x * 0.3, 11, camTarget.z + 14), 0.08);
  camera.lookAt(camTarget.x * 0.2, 0, camTarget.z - 2);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
addEventListener('resize', fit);
visualViewport?.addEventListener('resize', fit);
visualViewport?.addEventListener('scroll', fit);
requestAnimationFrame(tick);
  </script>
</body>
</html>
