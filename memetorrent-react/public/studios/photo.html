<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MT Photography Studio</title>
<link rel="stylesheet" href="kit.css"/>
<style>
  body{background:#120e0a;color:#f3e6c8}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:calc(100vh - 48px)}
  @media(max-width:800px){.wrap{grid-template-columns:1fr}}
  .view{padding:10px;min-width:0}
  .side{border-left:1px solid #3f2e1f;padding:12px;background:#1a140e}
  .stage{position:relative;background:#0b0906;border:1px solid #3f2e1f;min-height:360px}
  .stage canvas{max-width:100%;display:block;width:100%;height:auto}
  .drop{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none;color:#e7c07b;font-size:18px;font-weight:700}
  .drop.hide{display:none}
  #status{padding:8px 12px;background:#3f2e1f;color:#fde68a;font-weight:700}
  .tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
  .tabs button.on{background:#b45309;color:#fff}
  input[type=range]{width:130px}
  label.filebtn{display:inline-block;background:#b45309;color:#fff;font-weight:800;padding:8px 14px;border-radius:8px;cursor:pointer}
</style>
</head><body>
<div class="top" style="background:#2a2118">
  <strong style="color:#e7c07b">MT Photography</strong>
  <nav id="nav"></nav>
  <label class="filebtn">Choose photo
    <input id="file" type="file" accept="image/*,.jpg,.jpeg,.png,.webp,.gif,.bmp" hidden>
  </label>
  <button class="btn p" style="background:#b45309;color:#fff" id="go">Restore + 3D house</button>
  <button class="btn" id="game">Play in game</button>
  <button class="btn" id="sendw">To World 3D</button>
</div>
<div id="status">Choose a photo. The studio will restore it and build the house — you do not need extra clicks.</div>
<div class="wrap">
  <div class="view">
    <div class="tabs" id="vtabs">
      <button class="btn on" data-v="src">Source</button>
      <button class="btn" data-v="rest">Restored</button>
      <button class="btn" data-v="facade">Facade</button>
      <button class="btn" data-v="iso">3D house</button>
    </div>
    <div class="stage" id="stage">
      <div class="drop" id="drop">Drop a house photo here<br>or tap Choose photo</div>
      <canvas id="src" width="960" height="620"></canvas>
      <canvas id="rest" width="960" height="620" hidden></canvas>
      <canvas id="facade" width="512" height="512" hidden></canvas>
      <canvas id="iso" width="960" height="620" hidden></canvas>
    </div>
    <p id="pts">Optional: click 4 corners of the house (TL TR BR BL) then Restore + 3D house again for a tighter facade.</p>
  </div>
  <aside class="side">
    <canvas id="hist" width="280" height="48" style="width:100%;background:#0b0906"></canvas>
    <label class="row">Exposure <input id="exp" type="range" min="-50" max="50" value="10"></label>
    <label class="row">Contrast <input id="con" type="range" min="50" max="180" value="120"></label>
    <label class="row">Warmth <input id="warm" type="range" min="-40" max="40" value="14"></label>
    <label class="row">Saturation <input id="sat" type="range" min="0" max="200" value="115"></label>
    <label class="row">Colorize B&amp;W <input id="col" type="checkbox"></label>
    <label class="row">Width <input id="bw" type="range" min="40" max="180" value="100"></label>
    <label class="row">Height <input id="bh" type="range" min="40" max="180" value="90"></label>
    <label class="row">Depth <input id="bd" type="range" min="24" max="140" value="60"></label>
    <label class="row">Time <select id="tod"><option value="day">Day</option><option value="golden">Golden hour</option><option value="night">Night</option></select></label>
    <button class="btn" id="pngf">Facade PNG</button>
    <button class="btn" id="pngi">3D PNG</button>
    <p class="log" id="log"></p>
  </aside>
</div>
<script src="kit.js"></script>
<script>
(function(){
try { document.getElementById('nav').innerHTML = window.MT ? MT.nav('photo') : ''; } catch(e){}
const $ = id => document.getElementById(id);
const src=$('src'), sctx=src.getContext('2d',{willReadFrequently:true});
const rest=$('rest'), rctx=rest.getContext('2d',{willReadFrequently:true});
const fac=$('facade'), fctx=fac.getContext('2d',{willReadFrequently:true});
const iso=$('iso'), ictx=iso.getContext('2d');
let img=null, corners=[], restored=null;
function status(s){ $('status').textContent=s; $('log').textContent=s+'\n'+$('log').textContent; }
function show(v){
  ['src','rest','facade','iso'].forEach(id=>{ $(id).hidden = id!==v; });
  document.querySelectorAll('#vtabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  $('drop').classList.toggle('hide', !!img);
}
$('vtabs').onclick=e=>{ const b=e.target.closest('button'); if(b) show(b.dataset.v); };
function clamp(n){ return n<0?0:n>255?255:n; }
function drawSrc(){
  sctx.fillStyle='#0b0906'; sctx.fillRect(0,0,src.width,src.height);
  if(!img) return;
  const sc=Math.min(src.width/img.width, src.height/img.height);
  const w=img.width*sc, h=img.height*sc, x=(src.width-w)/2, y=(src.height-h)/2;
  sctx.drawImage(img,x,y,w,h);
  src._map={x,y,w,h,sc};
  sctx.fillStyle='#e7c07b'; sctx.strokeStyle='#e7c07b'; sctx.lineWidth=2;
  corners.forEach((p,i)=>{ sctx.beginPath(); sctx.arc(p.x,p.y,6,0,6.28); sctx.fill(); sctx.fillText(['TL','TR','BR','BL'][i], p.x+8,p.y-8); });
  if(corners.length===4){ sctx.beginPath(); corners.forEach((p,i)=> i?sctx.lineTo(p.x,p.y):sctx.moveTo(p.x,p.y)); sctx.closePath(); sctx.stroke(); }
}
async function fileToImage(file){
  if(window.createImageBitmap){
    try { return await createImageBitmap(file); } catch(e){}
  }
  return await new Promise((resolve,reject)=>{
    const im=new Image();
    im.onload=()=>resolve(im);
    im.onerror=()=>reject(new Error('Could not read this file. Use JPG or PNG (not HEIC).'));
    im.src=URL.createObjectURL(file);
  });
}
function downscale(im, max){
  const s=Math.min(1, max/Math.max(im.width, im.height));
  const c=document.createElement('canvas');
  c.width=Math.max(1, Math.round(im.width*s));
  c.height=Math.max(1, Math.round(im.height*s));
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  return c;
}
async function loadFile(file){
  if(!file) return;
  status('Opening '+file.name+'…');
  $('drop').classList.add('hide');
  try{
    const raw=await fileToImage(file);
    img=downscale(raw, 1600);
    corners=[];
    drawSrc(); show('src');
    status('Photo loaded '+img.width+'×'+img.height+'. Restoring and building the house…');
    await new Promise(r=>setTimeout(r,30));
    runPipeline();
  }catch(err){ status(err.message||String(err)); }
}
function restore(){
  if(!img) throw new Error('No photo yet');
  const c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
  const g=c.getContext('2d'); g.drawImage(img,0,0);
  const im=g.getImageData(0,0,c.width,c.height); const d=im.data;
  const exp=1+(+$('exp').value)/100, con=(+$('con').value)/100, warm=+$('warm').value, sat=(+$('sat').value)/100;
  let gmin=255,gmax=0, chroma=0;
  for(let i=0;i<d.length;i+=16){
    const y=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    if(y<gmin)gmin=y; if(y>gmax)gmax=y;
    chroma+=Math.abs(d[i]-d[i+1])+Math.abs(d[i+1]-d[i+2]);
  }
  const gray=chroma/(d.length/4)<8 || $('col').checked;
  const span=Math.max(8,gmax-gmin);
  for(let i=0;i<d.length;i+=4){
    let r=d[i], gv=d[i+1], b=d[i+2];
    r=(r-gmin)*255/span; gv=(gv-gmin)*255/span; b=(b-gmin)*255/span;
    r=(r-128)*con+128; gv=(gv-128)*con+128; b=(b-128)*con+128;
    r*=exp; gv*=exp; b*=exp;
    const y=0.299*r+0.587*gv+0.114*b;
    r=y+(r-y)*sat; gv=y+(gv-y)*sat; b=y+(b-y)*sat;
    r+=warm; b-=warm*0.6;
    if(gray){ r=y*1.18+22; gv=y*0.98+10; b=y*0.72+4; }
    d[i]=clamp(r); d[i+1]=clamp(gv); d[i+2]=clamp(b);
  }
  g.putImageData(im,0,0);
  restored=c;
  rctx.fillStyle='#0b0906'; rctx.fillRect(0,0,rest.width,rest.height);
  const sc=Math.min(rest.width/c.width, rest.height/c.height);
  rctx.drawImage(c,(rest.width-c.width*sc)/2,(rest.height-c.height*sc)/2,c.width*sc,c.height*sc);
  const hg=$('hist').getContext('2d'); hg.fillStyle='#0b0906'; hg.fillRect(0,0,280,48);
  const bins=new Uint32Array(64);
  for(let i=0;i<d.length;i+=32){ bins[(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])>>2]++; }
  let m=1; bins.forEach(v=>{ if(v>m)m=v; });
  hg.fillStyle='#e7c07b'; for(let i=0;i<64;i++) hg.fillRect(i*4.3, 48-(bins[i]/m)*48, 4, (bins[i]/m)*48);
}
function sample(imgd,x,y){
  const w=imgd.width,h=imgd.height,d=imgd.data;
  x=Math.max(0,Math.min(w-1.001,x)); y=Math.max(0,Math.min(h-1.001,y));
  const x0=x|0,y0=y|0,x1=Math.min(w-1,x0+1),y1=Math.min(h-1,y0+1), fx=x-x0, fy=y-y0;
  const i00=(y0*w+x0)*4,i10=(y0*w+x1)*4,i01=(y1*w+x0)*4,i11=(y1*w+x1)*4;
  const mix=(a,b,t)=>a+(b-a)*t;
  return [
    mix(mix(d[i00],d[i10],fx),mix(d[i01],d[i11],fx),fy),
    mix(mix(d[i00+1],d[i10+1],fx),mix(d[i01+1],d[i11+1],fx),fy),
    mix(mix(d[i00+2],d[i10+2],fx),mix(d[i01+2],d[i11+2],fx),fy)
  ];
}
function warp(){
  const pic=restored||img;
  const map=src._map || {x:0,y:0,w:pic.width,h:pic.height,sc:1};
  let q;
  if(corners.length===4){
    q=corners.map(p=>({x:(p.x-map.x)/map.sc, y:(p.y-map.y)/map.sc}));
  } else {
    const m=Math.min(pic.width,pic.height)*0.06;
    q=[{x:m,y:m},{x:pic.width-m,y:m},{x:pic.width-m,y:pic.height-m},{x:m,y:pic.height-m}];
  }
  const c=document.createElement('canvas'); c.width=pic.width; c.height=pic.height;
  c.getContext('2d').drawImage(pic,0,0);
  const srcd=c.getContext('2d').getImageData(0,0,c.width,c.height);
  const W=512,H=512, out=fctx.createImageData(W,H);
  const [tl,tr,br,bl]=q;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const u=x/(W-1), v=y/(H-1);
    const sx=(1-u)*(1-v)*tl.x + u*(1-v)*tr.x + u*v*br.x + (1-u)*v*bl.x;
    const sy=(1-u)*(1-v)*tl.y + u*(1-v)*tr.y + u*v*br.y + (1-u)*v*bl.y;
    const p=sample(srcd,sx,sy);
    const o=(y*W+x)*4; out.data[o]=p[0]; out.data[o+1]=p[1]; out.data[o+2]=p[2]; out.data[o+3]=255;
  }
  fctx.putImageData(out,0,0);
}
function geom(){ return {w:+$('bw').value,h:+$('bh').value,d:+$('bd').value}; }
function drawHouse(){
  const {w,h,d}=geom(); const yaw=0.9;
  const tod=$('tod').value;
  const sky=tod==='night'?['#050816','#1e1b4b']:tod==='golden'?['#7c2d12','#fbbf24']:['#7dd3fc','#e0f2fe'];
  const g=ictx.createLinearGradient(0,0,0,iso.height); g.addColorStop(0,sky[0]); g.addColorStop(1,sky[1]);
  ictx.fillStyle=g; ictx.fillRect(0,0,iso.width,iso.height);
  ictx.fillStyle='#365314'; ictx.fillRect(0,iso.height*0.72,iso.width,iso.height);
  const ox=iso.width/2, oy=iso.height*0.78, cos=Math.cos(yaw), sin=Math.sin(yaw);
  function P(x,y,z){ return {x:ox+x*cos-z*sin, y:oy-y+(x*sin+z*cos)*0.42}; }
  const pts=[[-w,0,0],[w,0,0],[w,0,d],[-w,0,d],[-w,h,0],[w,h,0],[w,h,d],[-w,h,d]].map(p=>P(p[0],p[1],p[2]));
  function poly(idx, fill){ ictx.beginPath(); idx.forEach((i,k)=>k?ictx.lineTo(pts[i].x,pts[i].y):ictx.moveTo(pts[i].x,pts[i].y)); ictx.closePath(); ictx.fillStyle=fill; ictx.fill(); }
  poly([1,2,6,5],'#6b4423'); poly([2,3,7,6],'#3f2a1a');
  const a=pts[0],b=pts[1],c=pts[5],d=pts[4];
  ictx.save(); ictx.beginPath(); ictx.moveTo(a.x,a.y); ictx.lineTo(b.x,b.y); ictx.lineTo(c.x,c.y); ictx.lineTo(d.x,d.y); ictx.closePath(); ictx.clip();
  const minx=Math.min(a.x,b.x,c.x,d.x), miny=Math.min(a.y,b.y,c.y,d.y);
  ictx.drawImage(fac, minx, miny, Math.max(8,Math.max(a.x,b.x,c.x,d.x)-minx), Math.max(8,Math.max(a.y,b.y,c.y,d.y)-miny));
  ictx.restore();
  const ridge=P(0,h+h*0.38,d/2);
  ictx.beginPath(); ictx.moveTo(pts[4].x,pts[4].y); ictx.lineTo(pts[5].x,pts[5].y); ictx.lineTo(ridge.x,ridge.y); ictx.fillStyle='#7f1d1d'; ictx.fill();
}
function saveHouse(){
  const payload={ name:'Photo house', facade:fac.toDataURL('image/png'), iso:iso.toDataURL('image/png'), geom:geom(), at:Date.now() };
  try { MT.set('mt-photo-house', payload); } catch(e){ status('House built (storage full — export PNG instead)'); }
  return payload;
}
function runPipeline(){
  if(!img){ status('Choose a photo first.'); return; }
  try{
    restore();
    warp();
    drawHouse();
    saveHouse();
    show('iso');
    status('Done. 3D house is built from your photo. Play in game or send to World 3D.');
  }catch(err){ status('Failed: '+(err.message||err)); console.error(err); }
}
$('file').addEventListener('change', e=>{ const f=e.target.files&&e.target.files[0]; if(f) loadFile(f); });
$('go').onclick=runPipeline;
['exp','con','warm','sat','col','bw','bh','bd','tod'].forEach(id=>{
  const el=$(id); if(el) el.addEventListener('change', ()=>{ if(img) runPipeline(); });
});
src.addEventListener('click', e=>{
  if(!img){ $('file').click(); return; }
  const r=src.getBoundingClientRect();
  corners.push({x:(e.clientX-r.left)*src.width/r.width, y:(e.clientY-r.top)*src.height/r.height});
  if(corners.length>4) corners=corners.slice(-4);
  $('pts').textContent='Corners '+corners.length+'/4';
  drawSrc();
  if(corners.length===4) runPipeline();
});
const stage=$('stage');
stage.addEventListener('dragover', e=>{ e.preventDefault(); });
stage.addEventListener('drop', e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) loadFile(f); });
addEventListener('paste', e=>{ const f=[...e.clipboardData.files][0]; if(f) loadFile(f); });
$('game').onclick=()=>{
  const house=(window.MT&&MT.get('mt-photo-house',null));
  if(!house){ status('Load a photo first.'); return; }
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>House</title>
<style>html,body{margin:0;height:100%;background:#0b1020;overflow:hidden}canvas{display:block}</style></head><body><canvas id="c"></canvas>
<script>
const iso=new Image(); iso.src="${house.iso}";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function sz(){ cv.width=innerWidth; cv.height=innerHeight; } sz(); addEventListener('resize',sz);
let x=120,y=0,vx=0,vy=0,keys={};
addEventListener('keydown',e=>keys[e.code]=true); addEventListener('keyup',e=>keys[e.code]=false);
function loop(){
  if(keys.ArrowLeft||keys.KeyA) vx-=.55; if(keys.ArrowRight||keys.KeyD) vx+=.55;
  vx*=.82; vy+=.55; x+=vx; y+=vy;
  const ground=cv.height-80; if(y>ground-22){ y=ground-22; vy=0; if(keys.ArrowUp||keys.KeyW||keys.Space) vy=-12; }
  const g=ctx.createLinearGradient(0,0,0,cv.height); g.addColorStop(0,'#7dd3fc'); g.addColorStop(1,'#e0f2fe');
  ctx.fillStyle=g; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#365314'; ctx.fillRect(0,ground,cv.width,cv.height);
  if(iso.complete) ctx.drawImage(iso, cv.width/2-220, ground-300, 440, 320);
  ctx.fillStyle='#14532d'; ctx.fillRect(x, y, 18, 22);
  requestAnimationFrame(loop);
}
iso.onload=loop; if(iso.complete) loop();
<\/script></body></html>`;
  window.open(URL.createObjectURL(new Blob([html],{type:'text/html'})));
};
$('sendw').onclick=()=>{ if(img) runPipeline(); location.href='world.html'; };
$('pngf').onclick=()=>fac.toBlob(b=>MT.download('facade.png',b,'image/png'));
$('pngi').onclick=()=>iso.toBlob(b=>MT.download('house3d.png',b,'image/png'));
status('Choose a photo (JPG/PNG). Restore and 3D house run automatically.');
})();
</script>
</body></html>
