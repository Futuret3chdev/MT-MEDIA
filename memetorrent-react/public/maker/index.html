<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MT Android Studio</title>
  <style>
    :root {
      --bg:#2b2b2b; --panel:#3c3f41; --edge:#515658; --text:#bbb;
      --a:#6a8759; --accent:#499c54; --tab:#4b4f51; --on:#4e5254;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:#2b2b2b; color:#bbb; font:13px/1.4 "Segoe UI",system-ui,sans-serif; }
    #ide { display:grid; height:100%; grid-template-rows:36px 32px 1fr 120px; }
    #titlebar {
      background:#3c3f41; display:flex; align-items:center; gap:10px;
      padding:0 10px; border-bottom:1px solid #1e1e1e; user-select:none;
    }
    #titlebar strong { color:#a5c261; letter-spacing:.3px; }
    #titlebar .win { margin-left:auto; opacity:.5; font-size:11px; }
    #toolbar {
      background:#3c3f41; display:flex; align-items:center; gap:6px; flex-wrap:wrap;
      padding:4px 8px; border-bottom:1px solid #1e1e1e;
    }
    #toolbar input, #toolbar select, #toolbar button {
      font:inherit; background:#45494a; color:#ccc; border:1px solid #646464;
      border-radius:3px; padding:3px 8px;
    }
    #toolbar button.primary { background:#499c54; color:#fff; border-color:#3d7a45; font-weight:700; }
    #toolbar button.run { background:#3574f0; color:#fff; border-color:#2b5fc4; font-weight:700; }
    #main { display:grid; grid-template-columns:200px 1fr; min-height:0; }
    #tree { background:#3c3f41; border-right:1px solid #1e1e1e; overflow:auto; padding:8px 0; }
    #tree h4 { margin:0 10px 6px; font-size:10px; letter-spacing:1px; color:#808080; }
    #tree button {
      display:block; width:100%; text-align:left; background:transparent; color:#bbb;
      border:0; padding:4px 12px; font:inherit; cursor:pointer;
    }
    #tree button:hover, #tree button.on { background:#4b6eaf; color:#fff; }
    #work { display:flex; flex-direction:column; min-width:0; min-height:0; }
    #tabs { display:flex; background:#3c3f41; border-bottom:1px solid #1e1e1e; }
    #tabs button { background:#3c3f41; color:#888; border:0; border-right:1px solid #1e1e1e; padding:6px 14px; font:inherit; }
    #tabs button.on { background:#4e5254; color:#fff; }
    #stage { flex:1; overflow:auto; background:#2b2b2b; padding:10px; }
    canvas { background:#0b1020; image-rendering:pixelated; cursor:crosshair; border:1px solid #1e1e1e; max-width:100%; }
    #brushes { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
    #brushes button { border:1px solid #646464; background:#45494a; color:#ccc; border-radius:3px; padding:4px 8px; font-size:12px; }
    #brushes button.on { background:#499c54; color:#fff; border-color:#3d7a45; }
    pre.code {
      margin:0; padding:12px; background:#2b2b2b; color:#a9b7c6; font:12px/1.45 ui-monospace,Consolas,monospace;
      white-space:pre-wrap; border:1px solid #1e1e1e;
    }
    #log {
      background:#2b2b2b; border-top:1px solid #1e1e1e; color:#a9b7c6;
      font:12px/1.4 ui-monospace,Consolas,monospace; padding:8px 10px; overflow:auto; white-space:pre-wrap;
    }
    #log .ok { color:#6a8759; }
    #log .bad { color:#d1675a; }
  </style>
</head>
<body>
<div id="ide">
  <div id="titlebar">
    <strong>MT Android Studio</strong>
    <span id="proj">app · Night Run</span>
    <span class="win">FutureT3ch · our Android IDE — not Google’s</span>
  </div>
  <div id="toolbar">
    <input id="name" value="Night Run" />
    <select id="theme">
      <option value="night">Night</option>
      <option value="forest">Forest</option>
      <option value="city">City</option>
      <option value="space">Space</option>
    </select>
    <button type="button" class="run" id="play">▶ Run</button>
    <button type="button" id="stop" hidden>■ Stop</button>
    <button type="button" class="primary" id="buildApk">Build APK</button>
    <button type="button" id="exportHtml">Save game.html</button>
    <button type="button" id="exportJson">Save JSON</button>
  </div>
  <div id="main">
    <aside id="tree">
      <h4>PROJECT</h4>
      <button type="button" class="on" data-tab="design">app/src/main/game (Design)</button>
      <button type="button" data-tab="html">app/src/main/assets/index.html</button>
      <button type="button" data-tab="manifest">AndroidManifest.xml</button>
      <button type="button" data-tab="activity">MainActivity.java</button>
    </aside>
    <div id="work">
      <div id="tabs">
        <button type="button" class="on" data-tab="design">Design</button>
        <button type="button" data-tab="html">index.html</button>
        <button type="button" data-tab="manifest">Manifest</button>
        <button type="button" data-tab="activity">MainActivity</button>
      </div>
      <div id="stage">
        <div id="pane-design">
          <div id="brushes"></div>
          <canvas id="c"></canvas>
        </div>
        <pre class="code" id="pane-html" hidden></pre>
        <pre class="code" id="pane-manifest" hidden></pre>
        <pre class="code" id="pane-activity" hidden></pre>
      </div>
    </div>
  </div>
  <div id="log">MT Android Studio ready. Paint a level, ▶ Run it here, then Build APK. This IDE compiles the Android package — you do not need Google Android Studio.</div>
</div>
<script>
const TILE = { empty:0, ground:1, hazard:2, coin:3, spawn:4, exit:5, enemy:6, spring:7 };
const BRUSHES = [
  [0,'Erase'],[1,'Ground'],[2,'Spike'],[3,'Coin'],[4,'Start'],[5,'Exit'],[6,'Enemy'],[7,'Spring']
];
const THEMES = {
  night: { bg:'#0b1020', ground:'#2a3348', accent:'#00ff99', hazard:'#ff4d6a', coin:'#ffd166' },
  forest: { bg:'#0d1a12', ground:'#2d5a3d', accent:'#9ef01a', hazard:'#e85d04', coin:'#ffe66d' },
  city: { bg:'#140c18', ground:'#3d2b56', accent:'#ff4dff', hazard:'#ff006e', coin:'#00f5d4' },
  space: { bg:'#070712', ground:'#1b2744', accent:'#48cae4', hazard:'#c77dff', coin:'#f4d35e' }
};
const COLS=32, ROWS=16, CELL=22;
const tiles = new Array(COLS*ROWS).fill(0);
for (let x=0;x<COLS;x++) tiles[(ROWS-1)*COLS+x]=1;
tiles[(ROWS-2)*COLS+2]=4;
tiles[(ROWS-5)*COLS+10]=1; tiles[(ROWS-5)*COLS+11]=1; tiles[(ROWS-5)*COLS+12]=1;
tiles[(ROWS-6)*COLS+11]=3;
tiles[(ROWS-2)*COLS+20]=2;
tiles[(ROWS-8)*COLS+22]=1; tiles[(ROWS-8)*COLS+23]=1; tiles[(ROWS-8)*COLS+24]=1;
tiles[(ROWS-9)*COLS+24]=5;
tiles[(ROWS-2)*COLS+14]=6;
let brush=1, playing=false, keys={}, raf=0;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
cv.width=COLS*CELL; cv.height=ROWS*CELL;

const bar=document.getElementById('brushes');
BRUSHES.forEach(([id,label])=>{
  const b=document.createElement('button');
  b.textContent=(id+1)+' '+label;
  b.onclick=()=>{ brush=id; [...bar.children].forEach(x=>x.classList.toggle('on', x===b)); };
  if(id===1) b.classList.add('on');
  bar.appendChild(b);
});

function logLine(text, cls){
  const el=document.getElementById('log');
  const span=document.createElement('div');
  if(cls) span.className=cls;
  span.textContent=text;
  el.appendChild(span);
  el.scrollTop=el.scrollHeight;
}
function th(){ return THEMES[document.getElementById('theme').value]; }
function color(t){
  const T=th();
  return [null,T.ground,T.hazard,T.coin,'#fff',T.accent,'#ff8fab','#90e0ef'][t];
}
function draw(){
  const T=th();
  ctx.fillStyle=T.bg; ctx.fillRect(0,0,cv.width,cv.height);
  for(let i=0;i<tiles.length;i++){
    const t=tiles[i]; if(!t) continue;
    const x=(i%COLS)*CELL, y=Math.floor(i/COLS)*CELL;
    ctx.fillStyle=color(t);
    if(t===2){ ctx.beginPath(); ctx.moveTo(x,y+CELL); ctx.lineTo(x+CELL/2,y); ctx.lineTo(x+CELL,y+CELL); ctx.fill(); }
    else if(t===3){ ctx.beginPath(); ctx.arc(x+CELL/2,y+CELL/2,CELL*0.28,0,6.28); ctx.fill(); }
    else ctx.fillRect(x+1,y+1,CELL-2,CELL-2);
  }
  if(playing){
    ctx.fillStyle='#19d37e';
    ctx.fillRect(player.x, player.y, 14, 16);
  }
}
function paintAt(e){
  const r=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/CELL*(cv.width/r.width));
  const y=Math.floor((e.clientY-r.top)/CELL*(cv.height/r.height));
  if(x<0||y<0||x>=COLS||y>=ROWS||playing) return;
  const i=y*COLS+x;
  if(brush===4){ for(let k=0;k<tiles.length;k++) if(tiles[k]===4) tiles[k]=0; }
  tiles[i]=brush;
  draw();
}
cv.onpointerdown=e=>{ cv.setPointerCapture(e.pointerId); paintAt(e); };
cv.onpointermove=e=>{ if(e.buttons) paintAt(e); };

let player={x:20,y:20,vx:0,vy:0};
function spawn(){
  const i=tiles.indexOf(4);
  const x=i<0?20:(i%COLS)*CELL+4;
  const y=i<0?20:Math.floor(i/COLS)*CELL-16;
  player={x,y,vx:0,vy:0};
}
function solid(px,py){
  const cx=Math.floor((px+7)/CELL), cy=Math.floor((py+15)/CELL);
  if(cx<0||cy<0||cx>=COLS||cy>=ROWS) return 1;
  const t=tiles[cy*COLS+cx];
  return t===1||t===7?t:0;
}
function cellAt(px,py){
  const cx=Math.floor((px+7)/CELL), cy=Math.floor((py+8)/CELL);
  if(cx<0||cy<0||cx>=COLS||cy>=ROWS) return 0;
  return tiles[cy*COLS+cx];
}
function tick(){
  if(!playing) return;
  if(keys['ArrowLeft']||keys['KeyA']) player.vx-=0.4;
  if(keys['ArrowRight']||keys['KeyD']) player.vx+=0.4;
  player.vx*=0.8;
  player.vy+=0.45;
  player.x+=player.vx;
  if(solid(player.x, player.y)) { player.x-=player.vx; player.vx=0; }
  player.y+=player.vy;
  if(solid(player.x, player.y)) {
    player.y-=player.vy; player.vy=0;
    if(keys['ArrowUp']||keys['KeyW']||keys['Space']) player.vy=-8.2;
  }
  const hit=cellAt(player.x, player.y);
  if(hit===2||hit===6) spawn();
  if(hit===3){ const i=Math.floor((player.y+8)/CELL)*COLS+Math.floor((player.x+7)/CELL); tiles[i]=0; }
  if(hit===5){ logLine('Run: reached exit.','ok'); stopPlay(); }
  if(player.y>ROWS*CELL) spawn();
  draw();
  raf=requestAnimationFrame(tick);
}
function stopPlay(){ playing=false; cancelAnimationFrame(raf); document.getElementById('play').hidden=false; document.getElementById('stop').hidden=true; draw(); }
document.getElementById('play').onclick=()=>{ playing=true; spawn(); document.getElementById('play').hidden=true; document.getElementById('stop').hidden=false; logLine('Run: emulator preview (this window).'); tick(); };
document.getElementById('stop').onclick=stopPlay;
addEventListener('keydown',e=>{ keys[e.code]=true; if(['Space','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup',e=>{ keys[e.code]=false; });

function spec(){
  return { type:'platformer', name:document.getElementById('name').value, theme:document.getElementById('theme').value, cols:COLS, rows:ROWS, tiles:tiles.slice() };
}
function gameHTML(){
  const s=spec();
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${s.name}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#000;color:#fff;font-family:system-ui}canvas{display:block;margin:10px auto;background:#111}</style></head>
<body><p style="text-align:center">${s.name} · arrows / WASD</p><canvas id="c"></canvas>
<script>
const COLS=${COLS},ROWS=${ROWS},CELL=24,tiles=${JSON.stringify(s.tiles)};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=COLS*CELL;cv.height=ROWS*CELL;
let p={x:20,y:20,vx:0,vy:0},keys={};
const i=tiles.indexOf(4); if(i>=0){p.x=(i%COLS)*CELL+4;p.y=Math.floor(i/COLS)*CELL-16;}
function solid(x,y){const cx=Math.floor((x+7)/CELL),cy=Math.floor((y+15)/CELL);if(cx<0||cy>=ROWS)return 1;const t=tiles[cy*COLS+cx];return t===1||t===7;}
function cell(x,y){const cx=Math.floor((x+7)/CELL),cy=Math.floor((y+8)/CELL);if(cx<0||cy>=ROWS)return 0;return tiles[cy*COLS+cx];}
addEventListener('keydown',e=>keys[e.code]=true); addEventListener('keyup',e=>keys[e.code]=false);
function loop(){
  if(keys.ArrowLeft||keys.KeyA)p.vx-=.4; if(keys.ArrowRight||keys.KeyD)p.vx+=.4;
  p.vx*=.8; p.vy+=.45; p.x+=p.vx; if(solid(p.x,p.y)){p.x-=p.vx;p.vx=0;} p.y+=p.vy;
  if(solid(p.x,p.y)){p.y-=p.vy;p.vy=0; if(keys.ArrowUp||keys.KeyW||keys.Space)p.vy=-8.2;}
  const h=cell(p.x,p.y); if(h===2||h===6){const i=tiles.indexOf(4);p.x=(i%COLS)*CELL+4;p.y=Math.floor(i/COLS)*CELL-16;p.vx=p.vy=0;}
  if(h===3){tiles[Math.floor((p.y+8)/CELL)*COLS+Math.floor((p.x+7)/CELL)]=0;}
  ctx.fillStyle='#0b1020';ctx.fillRect(0,0,cv.width,cv.height);
  for(let i=0;i<tiles.length;i++){const t=tiles[i]; if(!t)continue; const x=(i%COLS)*CELL,y=(i/COLS|0)*CELL;
    ctx.fillStyle=['','#2a3348','#ff4d6a','#ffd166','#fff','#19d37e','#ff8fab','#90e0ef'][t]; ctx.fillRect(x+1,y+1,CELL-2,CELL-2);}
  ctx.fillStyle='#19d37e'; ctx.fillRect(p.x,p.y,14,16);
  requestAnimationFrame(loop);
}
loop();
<\/script></body></html>`;
}
function download(name, text, type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name; a.click();
}
function downloadBytes(name, buf, type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([buf],{type}));
  a.download=name; a.click();
}
function slug(s){ return String(s||'game').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'')||'game'; }

const MANIFEST = `<?xml version="1.0" encoding="utf-8"?>
<manifest package="au.com.futuret3ch.made">
    <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
    <application android:label="MT Game" android:icon="@drawable/ic_launcher">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>`;
const ACTIVITY = `package au.com.futuret3ch.made;

import android.os.Bundle;
import android.webkit.WebView;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    @Override protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        WebView web = new WebView(this);
        web.getSettings().setJavaScriptEnabled(true);
        web.loadUrl("file:///android_asset/index.html");
        setContentView(web);
    }
}`;

function showTab(id){
  document.querySelectorAll('#tabs button, #tree button').forEach(b=>b.classList.toggle('on', b.dataset.tab===id));
  document.getElementById('pane-design').hidden = id!=='design';
  document.getElementById('pane-html').hidden = id!=='html';
  document.getElementById('pane-manifest').hidden = id!=='manifest';
  document.getElementById('pane-activity').hidden = id!=='activity';
  if(id==='html') document.getElementById('pane-html').textContent = gameHTML();
  if(id==='manifest') document.getElementById('pane-manifest').textContent = MANIFEST;
  if(id==='activity') document.getElementById('pane-activity').textContent = ACTIVITY;
}
document.querySelectorAll('#tabs button, #tree button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
document.getElementById('name').oninput=()=>{
  document.getElementById('proj').textContent='app · '+document.getElementById('name').value;
};

document.getElementById('exportJson').onclick=()=>download((spec().name||'level')+'.json', JSON.stringify(spec()), 'application/json');
document.getElementById('exportHtml').onclick=()=>{
  const html=gameHTML();
  download(slug(spec().name)+'.html', html, 'text/html');
  logLine('Saved '+slug(spec().name)+'.html','ok');
};

document.getElementById('buildApk').onclick=async ()=>{
  const html=gameHTML();
  const name=slug(spec().name);
  logLine('Build APK: packaging '+name+' …');
  try {
    const res=await fetch('/build/apk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:spec().name,html})});
    if(!res.ok){
      const t=await res.text();
      throw new Error(t||('HTTP '+res.status));
    }
    const buf=await res.arrayBuffer();
    downloadBytes(name+'.apk', buf, 'application/vnd.android.package-archive');
    logLine('BUILD SUCCESSFUL — '+name+'.apk ('+buf.byteLength+' bytes). Sideload on a phone. This IDE signed it; Google Android Studio was not used.','ok');
  } catch(e){
    logLine('Build APK needs the MT Android Studio app (Windows / Mac / Android download). This browser preview cannot compile packages. '+e.message,'bad');
  }
};

draw();
</script>
</body>
</html>
