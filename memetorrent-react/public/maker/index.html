<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MT Maker</title>
  <style>
    :root { --bg:#0b1020; --g:#2a3348; --a:#19d37e; --h:#ff4d6a; --c:#ffd166; }
    * { box-sizing: border-box; }
    html,body { margin:0; height:100%; background:#07090f; color:#e8eaf0; font-family:system-ui,sans-serif; }
    header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 10px; border-bottom:1px solid #1e293b; }
    header strong { color:var(--a); }
    header input, header select, header button { font:inherit; background:#111827; color:#fff; border:1px solid #334155; border-radius:8px; padding:6px 10px; }
    header button.primary { background:var(--a); color:#04140c; border:0; font-weight:800; }
    #brushes { display:flex; flex-wrap:wrap; gap:6px; padding:8px 10px; }
    #brushes button { border:1px solid #334155; background:#111827; color:#fff; border-radius:999px; padding:6px 10px; font-size:12px; }
    #brushes button.on { background:var(--a); color:#04140c; }
    #stage { display:flex; justify-content:center; padding:8px; overflow:auto; }
    canvas { background:var(--bg); image-rendering:pixelated; cursor:crosshair; border-radius:8px; max-width:100%; }
    #msg { font-size:12px; opacity:.7; padding:0 10px 10px; }
  </style>
</head>
<body>
  <header>
    <strong>MT Maker</strong>
    <input id="name" value="Night Run" />
    <select id="theme">
      <option value="night">Night</option>
      <option value="forest">Forest</option>
      <option value="city">City</option>
      <option value="space">Space</option>
    </select>
    <button type="button" id="play">Play</button>
    <button type="button" id="stop" hidden>Stop</button>
    <button type="button" class="primary" id="exportHtml">Export game.html</button>
    <button type="button" id="exportAndroid">Export Android Studio project</button>
    <button type="button" id="exportIos">Export Xcode project</button>
    <button type="button" id="exportJson">Export JSON</button>
    <a href="https://memetorrent.futuret3ch.com.au/software/games/sdk" style="color:#19d37e;font-size:12px">SDK</a>
  </header>
  <div id="brushes"></div>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="msg">Paint a level. Play it here. Export game.html, or Export Android Studio project and open that folder in Android Studio to compile the APK — Maker does not replace Studio.</div>
  <script>
const TILE = { empty:0, ground:1, hazard:2, coin:3, spawn:4, exit:5, enemy:6, spring:7 };
const BRUSHES = [
  [0,'Erase'],[1,'Ground'],[2,'Spike'],[3,'Coin'],[4,'Start'],[5,'Exit'],[6,'Enemy'],[7,'Spring']
];
const THEMES = {
  night: { bg:'#0b1020', ground:'#2a3348', accent:'#00ff99', hazard:'#ff4d6a', coin:'#ffd166' },
  forest: { bg:'#0d1a12', ground:'#2d5a3d', accent:'#9ef01a', hazard:'#e85d04', coin:'#ffe66d' },
  city: { bg:'#140c18', ground:'#3d2b56', accent:'#ff4dff', hazard:'#ff006e', coin:'#00f5d4' },
  space: { bg:'#070712', ground:'#1b2744', accent:'#48cae4', hazard:'#c77dff', coin:'#f4d35e' }
};
const COLS=32, ROWS=16, CELL=22;
const tiles = new Array(COLS*ROWS).fill(0);
for (let x=0;x<COLS;x++) tiles[(ROWS-1)*COLS+x]=1;
tiles[(ROWS-2)*COLS+2]=4;
tiles[(ROWS-5)*COLS+10]=1; tiles[(ROWS-5)*COLS+11]=1; tiles[(ROWS-5)*COLS+12]=1;
tiles[(ROWS-6)*COLS+11]=3;
tiles[(ROWS-2)*COLS+20]=2;
tiles[(ROWS-8)*COLS+22]=1; tiles[(ROWS-8)*COLS+23]=1; tiles[(ROWS-8)*COLS+24]=1;
tiles[(ROWS-9)*COLS+24]=5;
tiles[(ROWS-2)*COLS+14]=6;
let brush=1, playing=false, keys={}, raf=0;
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
cv.width=COLS*CELL; cv.height=ROWS*CELL;

const bar=document.getElementById('brushes');
BRUSHES.forEach(([id,label])=>{
  const b=document.createElement('button');
  b.textContent=(id+1)+' '+label;
  b.onclick=()=>{ brush=id; [...bar.children].forEach(x=>x.classList.toggle('on', x===b)); };
  if(id===1) b.classList.add('on');
  bar.appendChild(b);
});

function th(){ return THEMES[document.getElementById('theme').value]; }
function color(t){
  const T=th();
  return [null,T.ground,T.hazard,T.coin,'#fff',T.accent,'#ff8fab','#90e0ef'][t];
}
function draw(){
  const T=th();
  ctx.fillStyle=T.bg; ctx.fillRect(0,0,cv.width,cv.height);
  for(let i=0;i<tiles.length;i++){
    const t=tiles[i]; if(!t) continue;
    const x=(i%COLS)*CELL, y=Math.floor(i/COLS)*CELL;
    ctx.fillStyle=color(t);
    if(t===2){ ctx.beginPath(); ctx.moveTo(x,y+CELL); ctx.lineTo(x+CELL/2,y); ctx.lineTo(x+CELL,y+CELL); ctx.fill(); }
    else if(t===3){ ctx.beginPath(); ctx.arc(x+CELL/2,y+CELL/2,CELL*0.28,0,6.28); ctx.fill(); }
    else ctx.fillRect(x+1,y+1,CELL-2,CELL-2);
  }
  if(playing){
    ctx.fillStyle='#19d37e';
    ctx.fillRect(player.x, player.y, 14, 16);
  }
}
function paintAt(e){
  const r=cv.getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/CELL*(cv.width/r.width));
  const y=Math.floor((e.clientY-r.top)/CELL*(cv.height/r.height));
  if(x<0||y<0||x>=COLS||y>=ROWS||playing) return;
  const i=y*COLS+x;
  if(brush===4){ for(let k=0;k<tiles.length;k++) if(tiles[k]===4) tiles[k]=0; }
  tiles[i]=brush;
  draw();
}
cv.onpointerdown=e=>{ cv.setPointerCapture(e.pointerId); paintAt(e); };
cv.onpointermove=e=>{ if(e.buttons) paintAt(e); };

let player={x:20,y:20,vx:0,vy:0};
function spawn(){
  const i=tiles.indexOf(4);
  const x=i<0?20:(i%COLS)*CELL+4;
  const y=i<0?20:Math.floor(i/COLS)*CELL-16;
  player={x,y,vx:0,vy:0};
}
function solid(px,py){
  const cx=Math.floor((px+7)/CELL), cy=Math.floor((py+15)/CELL);
  if(cx<0||cy<0||cx>=COLS||cy>=ROWS) return 1;
  const t=tiles[cy*COLS+cx];
  return t===1||t===7?t:0;
}
function cellAt(px,py){
  const cx=Math.floor((px+7)/CELL), cy=Math.floor((py+8)/CELL);
  if(cx<0||cy<0||cx>=COLS||cy>=ROWS) return 0;
  return tiles[cy*COLS+cx];
}
function tick(){
  if(!playing) return;
  if(keys['ArrowLeft']||keys['KeyA']) player.vx-=0.4;
  if(keys['ArrowRight']||keys['KeyD']) player.vx+=0.4;
  player.vx*=0.8;
  player.vy+=0.45;
  player.x+=player.vx;
  if(solid(player.x, player.y)) { player.x-=player.vx; player.vx=0; }
  player.y+=player.vy;
  if(solid(player.x, player.y)) {
    player.y-=player.vy; player.vy=0;
    if(keys['ArrowUp']||keys['KeyW']||keys['Space']) player.vy=-8.2;
  }
  const hit=cellAt(player.x, player.y);
  if(hit===2||hit===6) spawn();
  if(hit===3){ const i=Math.floor((player.y+8)/CELL)*COLS+Math.floor((player.x+7)/CELL); tiles[i]=0; }
  if(hit===5){ document.getElementById('msg').textContent='You reached the exit. Export the game or keep painting.'; stopPlay(); }
  if(player.y>ROWS*CELL) spawn();
  draw();
  raf=requestAnimationFrame(tick);
}
function stopPlay(){ playing=false; cancelAnimationFrame(raf); document.getElementById('play').hidden=false; document.getElementById('stop').hidden=true; draw(); }
document.getElementById('play').onclick=()=>{ playing=true; spawn(); document.getElementById('play').hidden=true; document.getElementById('stop').hidden=false; tick(); };
document.getElementById('stop').onclick=stopPlay;
addEventListener('keydown',e=>{ keys[e.code]=true; if(['Space','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup',e=>{ keys[e.code]=false; });

function spec(){
  return { type:'platformer', name:document.getElementById('name').value, theme:document.getElementById('theme').value, cols:COLS, rows:ROWS, tiles:tiles.slice() };
}
function download(name, text, type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type}));
  a.download=name; a.click();
}
document.getElementById('exportJson').onclick=()=>download((spec().name||'level')+'.json', JSON.stringify(spec()), 'application/json');
document.getElementById('exportHtml').onclick=()=>{
  const s=spec();
  const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${s.name}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:#000;color:#fff;font-family:system-ui}canvas{display:block;margin:10px auto;background:#111}</style></head>
<body><p style="text-align:center">${s.name} · arrows / WASD</p><canvas id="c"></canvas>
<script>
const COLS=${COLS},ROWS=${ROWS},CELL=24,tiles=${JSON.stringify(s.tiles)};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=COLS*CELL;cv.height=ROWS*CELL;
let p={x:20,y:20,vx:0,vy:0},keys={};
const i=tiles.indexOf(4); if(i>=0){p.x=(i%COLS)*CELL+4;p.y=Math.floor(i/COLS)*CELL-16;}
function solid(x,y){const cx=Math.floor((x+7)/CELL),cy=Math.floor((y+15)/CELL);if(cx<0||cy>=ROWS)return 1;const t=tiles[cy*COLS+cx];return t===1||t===7;}
function cell(x,y){const cx=Math.floor((x+7)/CELL),cy=Math.floor((y+8)/CELL);if(cx<0||cy>=ROWS)return 0;return tiles[cy*COLS+cx];}
addEventListener('keydown',e=>keys[e.code]=true); addEventListener('keyup',e=>keys[e.code]=false);
function loop(){
  if(keys.ArrowLeft||keys.KeyA)p.vx-=.4; if(keys.ArrowRight||keys.KeyD)p.vx+=.4;
  p.vx*=.8; p.vy+=.45; p.x+=p.vx; if(solid(p.x,p.y)){p.x-=p.vx;p.vx=0;} p.y+=p.vy;
  if(solid(p.x,p.y)){p.y-=p.vy;p.vy=0; if(keys.ArrowUp||keys.KeyW||keys.Space)p.vy=-8.2;}
  const h=cell(p.x,p.y); if(h===2||h===6){const i=tiles.indexOf(4);p.x=(i%COLS)*CELL+4;p.y=Math.floor(i/COLS)*CELL-16;p.vx=p.vy=0;}
  if(h===3){tiles[Math.floor((p.y+8)/CELL)*COLS+Math.floor((p.x+7)/CELL)]=0;}
  ctx.fillStyle='#0b1020';ctx.fillRect(0,0,cv.width,cv.height);
  for(let i=0;i<tiles.length;i++){const t=tiles[i]; if(!t)continue; const x=(i%COLS)*CELL,y=(i/COLS|0)*CELL;
    ctx.fillStyle=['','#2a3348','#ff4d6a','#ffd166','#fff','#19d37e','#ff8fab','#90e0ef'][t]; ctx.fillRect(x+1,y+1,CELL-2,CELL-2);}
  ctx.fillStyle='#19d37e'; ctx.fillRect(p.x,p.y,14,16);
  requestAnimationFrame(loop);
}
loop();
<\/script></body></html>`;
  download((s.name||'game').replace(/\s+/g,'-')+'.html', html, 'text/html');
  document.getElementById('msg').textContent='Saved a standalone HTML game. Send it to anyone — no server required.';
  window.__lastHtml = html;
};
function crc32(data){
  if(typeof crc32.t==='undefined'){
    const t=new Uint32Array(256);
    for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c=c&1?0xedb88320^(c>>>1):c>>>1; t[i]=c>>>0; }
    crc32.t=t;
  }
  let crc=0xffffffff;
  for(let i=0;i<data.length;i++) crc=crc32.t[(crc^data[i])&255]^(crc>>>8);
  return (crc^0xffffffff)>>>0;
}
function zipStore(files){
  const enc=new TextEncoder();
  const u16=n=>{const b=new Uint8Array(2); new DataView(b.buffer).setUint16(0,n,true); return b;};
  const u32=n=>{const b=new Uint8Array(4); new DataView(b.buffer).setUint32(0,n,true); return b;};
  const chunks=[], central=[]; let offset=0;
  for(const f of files){
    const name=enc.encode(f.name.replace(/\\/g,'/'));
    const data=typeof f.data==='string'?enc.encode(f.data):f.data;
    const crc=crc32(data);
    const local=[u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data];
    chunks.push(...local);
    central.push(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name);
    offset+=30+name.length+data.length;
  }
  const centralStart=offset;
  let centralSize=0;
  for(const c of central){ chunks.push(c); centralSize+=c.length; }
  const n=files.length;
  chunks.push(u32(0x06054b50),u16(0),u16(0),u16(n),u16(n),u32(centralSize),u32(centralStart),u16(0));
  const total=chunks.reduce((s,p)=>s+p.length,0);
  const out=new Uint8Array(total);
  let o=0; for(const p of chunks){ out.set(p,o); o+=p.length; }
  return out;
}
function saveZip(filename, files){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([zipStore(files)],{type:'application/zip'}));
  a.download=filename; a.click();
}
function slug(s){ return String(s||'game').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'')||'game'; }

async function exportZip(kind){
  if(!window.__lastHtml) document.getElementById('exportHtml').click();
  const html = window.__lastHtml;
  if(!html){ document.getElementById('msg').textContent='Export game.html once first.'; return; }
  const folder=slug(spec().name);
  try {
    const res = await fetch('/export/'+kind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:spec().name,html})});
    if(res.ok){
      const blob = await res.blob();
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=folder+'-'+kind+'.zip';
      a.click();
    } else {
      throw new Error('no local exporter');
    }
  } catch(e){
    saveZip(folder+'-'+kind+'.zip', kind==='android' ? androidStudioFiles(html, folder) : xcodeFiles(html, folder));
  }
  document.getElementById('msg').textContent= kind==='android'
    ? 'Unzip → Android Studio → File → Open that folder → Run. That is how you compile the APK.'
    : 'Unzip → open MTMadeGame.xcodeproj in Xcode → sign → Archive.';
}
document.getElementById('exportAndroid').onclick=()=>exportZip('android');
document.getElementById('exportIos').onclick=()=>exportZip('ios');
draw();
