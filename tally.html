<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Stats | MemeTorrent</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #111 0%, #222 100%); color: #fff; padding: 20px; margin: 0; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 2.2em; margin: 0; background: linear-gradient(45deg, #28a745, #20c997); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #9ca3af; font-size: 0.95em; margin-top: 6px; }
        .last-updated { color: #aaa; font-size: 0.9em; margin-top: 8px; font-family: 'Courier New', monospace; }
        .staff-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; max-width: 960px; margin: 0 auto 18px; padding: 14px; background: rgba(255,255,255,0.08); border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); }
        .staff-toolbar input[type="text"] { flex: 1; min-width: 200px; padding: 10px 12px; border-radius: 8px; border: 1px solid #4b5563; background: #fff; color: #111827; font-size: 14px; }
        .staff-toolbar input::placeholder { color: #6b7280; }
        .btn { padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; }
        .btn-primary { background: linear-gradient(45deg, #28a745, #20c997); color: #fff; }
        .btn-secondary { background: #374151; color: #fff; }
        .btn:hover { opacity: 0.92; transform: translateY(-1px); }
        .tabs { display: flex; justify-content: center; margin: 16px auto; max-width: 960px; background: rgba(255,255,255,0.1); border-radius: 25px; padding: 4px; }
        .tablink { background: transparent; color: #fff; padding: 12px 24px; border: none; cursor: pointer; border-radius: 20px; font-size: 1em; flex: 1; text-align: center; transition: all .3s; }
        .tablink.active { background: linear-gradient(45deg, #28a745, #20c997); }
        .tabcontent { display: none; max-width: 960px; margin: 16px auto; background: rgba(255,255,255,0.08); border-radius: 15px; padding: 22px; }
        .tabcontent.active { display: block; }
        .section { margin-bottom: 28px; }
        .section h3 { color: #28a745; border-bottom: 2px solid #28a745; padding-bottom: 8px; margin-bottom: 12px; font-size: 1.2em; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .section-actions { font-size: 12px; font-weight: normal; }
        .section-actions button { background: #1f2937; color: #e5e7eb; border: 1px solid #4b5563; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .chart-wrap { background: rgba(0,0,0,0.25); border-radius: 10px; padding: 12px; margin-bottom: 14px; height: 280px; }
        .range-controls { text-align: center; margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
        .range-controls input { padding: 8px; border-radius: 6px; border: none; background: rgba(255,255,255,0.15); color: #fff; }
        table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        th { background: linear-gradient(45deg, #218838, #28a745); font-size: 0.8em; text-transform: uppercase; }
        tr:hover { background: rgba(40,167,69,0.1); }
        .user-id { width: 90px; font-family: 'Courier New', monospace; font-size: 0.85em; }
        .username { max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .message-count { text-align: right; font-weight: 600; color: #28a745; white-space: nowrap; }
        .trend { text-align: center; width: 70px; font-size: 0.9em; }
        .trend-up { color: #4ade80; }
        .trend-down { color: #f87171; }
        .trend-same { color: #9ca3af; }
        .trend-new { color: #60a5fa; }
        .badge-yesterday { font-size: 0.75em; color: #fbbf24; margin-left: 4px; }
        .state-box { text-align: center; padding: 22px 16px; border-radius: 10px; line-height: 1.5; }
        .state-loading { color: #28a745; font-style: italic; animation: pulse 1.5s infinite; }
        .state-empty { background: rgba(255,255,255,0.05); color: #d1d5db; }
        .state-error { background: rgba(220,38,38,0.15); color: #fecaca; border: 1px solid rgba(248,113,113,0.4); }
        .state-filtered { background: rgba(59,130,246,0.12); color: #bfdbfe; }
        @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.5} }
        @media (max-width: 640px) { .tabs { flex-direction: column; } .staff-toolbar { flex-direction: column; } table { font-size: 0.85em; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>Message Leaderboard</h1>
        <div class="subtitle">Moderator / Admin / Manager view — Australia/Melbourne (AEST)</div>
        <div class="last-updated" id="lastUpdated">Loading...</div>
    </div>

    <div class="staff-toolbar">
        <input type="text" id="userSearch" placeholder="Search @username or user ID…" autocomplete="off">
        <button class="btn btn-secondary" id="btnRefresh" type="button">Refresh</button>
        <button class="btn btn-primary" id="btnExportCsv" type="button">Export CSV (this tab)</button>
    </div>

    <div class="tabs">
        <button class="tablink active" data-tab="Telegram">Telegram</button>
        <button class="tablink" data-tab="Discord">Discord</button>
        <button class="tablink" data-tab="Custom">Custom Range</button>
    </div>

    <div id="Telegram" class="tabcontent active">
        <div class="section">
            <h3>Daily Top Talkers <span class="section-actions"><button type="button" data-export="tg_daily">CSV daily</button></span></h3>
            <div class="chart-wrap"><canvas id="chartTgDaily"></canvas></div>
            <div id="tg_daily" class="state-box state-loading">Loading…</div>
        </div>
        <div class="section">
            <h3>Monthly Champions <span class="section-actions"><button type="button" data-export="tg_monthly">CSV monthly</button></span></h3>
            <div class="chart-wrap"><canvas id="chartTgMonthly"></canvas></div>
            <div id="tg_monthly" class="state-box state-loading">Loading…</div>
        </div>
    </div>

    <div id="Discord" class="tabcontent">
        <div class="section">
            <h3>Daily Top Talkers <span class="section-actions"><button type="button" data-export="dc_daily">CSV daily</button></span></h3>
            <div class="chart-wrap"><canvas id="chartDcDaily"></canvas></div>
            <div id="dc_daily" class="state-box state-loading">Loading…</div>
        </div>
        <div class="section">
            <h3>Monthly Champions <span class="section-actions"><button type="button" data-export="dc_monthly">CSV monthly</button></span></h3>
            <div class="chart-wrap"><canvas id="chartDcMonthly"></canvas></div>
            <div id="dc_monthly" class="state-box state-loading">Loading…</div>
        </div>
    </div>

    <div id="Custom" class="tabcontent">
        <div class="range-controls">
            <input type="text" id="startDate" placeholder="Start (YYYY-MM-DD)">
            <input type="text" id="endDate" placeholder="End (YYYY-MM-DD)">
            <button class="btn btn-primary" id="btnCustomSearch" type="button">Search range</button>
            <button class="btn btn-secondary" type="button" data-preset="7">Last 7 days</button>
            <button class="btn btn-secondary" type="button" data-preset="month">This month</button>
        </div>
        <div class="section">
            <h3>Telegram (custom) <span class="section-actions"><button type="button" data-export="custom_tg">CSV range</button></span></h3>
            <div class="chart-wrap"><canvas id="chartCustomTg"></canvas></div>
            <div id="custom_tg" class="state-box state-empty">Select dates and search.</div>
        </div>
        <div class="section">
            <h3>Discord (custom) <span class="section-actions"><button type="button" data-export="custom_dc">CSV range</button></span></h3>
            <div class="chart-wrap"><canvas id="chartCustomDc"></canvas></div>
            <div id="custom_dc" class="state-box state-empty">Select dates and search.</div>
        </div>
    </div>

    <script>
    (function () {
        const onMemetorrent = /memetorrent\.futuret3ch\.com\.au/i.test(location.hostname);
        const DATA_SOURCES = onMemetorrent ? [
            q => '/api/message-counts' + q,
            q => 'message_counts.php' + q,
            q => 'https://futuret3ch.com.au/message_counts.php' + q
        ] : [
            q => 'message_counts.php' + q,
            q => '/api/message-counts' + q,
            q => 'https://futuret3ch.com.au/message_counts.php' + q
        ];

        const charts = {};
        const store = {
            activeTab: 'Telegram',
            lastPayload: null,
            customRange: null,
            loadFailed: false,
            sections: {}
        };

        const fpStart = flatpickr('#startDate', { dateFormat: 'Y-m-d' });
        const fpEnd = flatpickr('#endDate', { dateFormat: 'Y-m-d' });

        function esc(t) {
            return !t ? 'Anonymous' : String(t).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
        }

        function medal(r) { return ({ 1: '1st', 2: '2nd', 3: '3rd' })[r] || ''; }

        function getSearch() {
            return (document.getElementById('userSearch').value || '').trim().toLowerCase().replace(/^@/, '');
        }

        function filterRows(rows) {
            const q = getSearch();
            if (!q) return rows || [];
            return (rows || []).filter(row => {
                const un = String(row.username || '').toLowerCase();
                const id = String(row.user_id || '');
                return un.includes(q) || id.includes(q);
            });
        }

        function buildPrevRankMap(previousRows) {
            const map = {};
            (previousRows || []).forEach((row, i) => { map[String(row.user_id)] = i + 1; });
            return map;
        }

        function trendHtml(currentRank, userId, prevMap) {
            const prev = prevMap[String(userId)];
            if (prev == null) return '<span class="trend trend-new" title="New today">NEW</span>';
            const delta = prev - currentRank;
            if (delta > 0) return `<span class="trend trend-up" title="Was #${prev} yesterday">↑${delta}</span>`;
            if (delta < 0) return `<span class="trend trend-down" title="Was #${prev} yesterday">↓${Math.abs(delta)}</span>`;
            return `<span class="trend trend-same" title="Same as yesterday (#${prev})">→</span>`;
        }

        function emptyMessage(opts) {
            const { platform, period, apiError, hadRows, filtered } = opts;
            if (filtered) {
                return '<div class="state-box state-filtered">No users match your search. Clear the search box to see everyone.</div>';
            }
            if (apiError) {
                return '<div class="state-box state-error"><strong>API error</strong><br>Could not load message stats. Try Refresh, or use the legacy board at <a href="https://futuret3ch.com.au/tally.html" style="color:#86efac">futuret3ch.com.au/tally.html</a>.</div>';
            }
            if (platform === 'discord') {
                return '<div class="state-box state-empty"><strong>No Discord messages for this period</strong><br>Either nobody chatted, or Discord tracking is not feeding this dashboard yet. Telegram stats are unaffected.</div>';
            }
            if (period === 'custom') {
                return '<div class="state-box state-empty"><strong>No Telegram messages in that date range</strong><br>Try widening the range or pick different dates (Melbourne time).</div>';
            }
            if (period === 'monthly') {
                return '<div class="state-box state-empty"><strong>No monthly totals yet</strong><br>The month may have just started, or monthly aggregation has not run.</div>';
            }
            return '<div class="state-box state-empty"><strong>No messages recorded for today</strong><br>Quiet day, or daily counts have not synced yet.</div>';
        }

        function renderTable(data, container, opts) {
            const { platform, period, prevMap, apiError } = opts;
            const allRows = data || [];
            const rows = filterRows(allRows);
            store.sections[container] = { rows: allRows, platform, period, prevMap };

            if (apiError) {
                $(container).html(emptyMessage({ platform, period, apiError: true }));
                return;
            }
            if (!allRows.length) {
                $(container).html(emptyMessage({ platform, period }));
                return;
            }
            if (!rows.length) {
                $(container).html(emptyMessage({ platform, period, filtered: true }));
                return;
            }

            const showTrend = period === 'daily' && prevMap && Object.keys(prevMap).length > 0;
            let html = '<table><thead><tr><th>#</th><th>ID</th><th>Username</th>';
            if (showTrend) html += '<th>Trend</th>';
            html += '<th>Messages</th></tr></thead><tbody>';

            rows.forEach((row, i) => {
                const cnt = row.message_count ?? row.total_message_count;
                const rank = i + 1;
                const color = rank === 1 ? '#ffd700' : rank === 2 ? '#c0c0c0' : rank === 3 ? '#cd7f32' : '#fff';
                const wasFirst = showTrend && prevMap[String(row.user_id)] === 1;
                html += `<tr>
                    <td>${rank}</td>
                    <td class="user-id">${row.user_id}</td>
                    <td class="username" title="${esc(row.username)}">${esc(row.username)}${wasFirst ? '<span class="badge-yesterday" title="#1 yesterday">★ was #1</span>' : ''}</td>`;
                if (showTrend) html += `<td>${trendHtml(rank, row.user_id, prevMap)}</td>`;
                html += `<td class="message-count"><span style="color:${color}">${cnt}</span>${rank <= 3 ? ` <span style="color:${color};font-size:0.8em">${medal(rank)}</span>` : ''}</td></tr>`;
            });
            html += '</tbody></table>';
            $(container).html(html);
        }

        function destroyChart(id) {
            if (charts[id]) { charts[id].destroy(); delete charts[id]; }
        }

        function renderBarChart(canvasId, rows, label) {
            destroyChart(canvasId);
            const el = document.getElementById(canvasId);
            if (!el) return;
            const top = filterRows(rows).slice(0, 10);
            if (!top.length) return;
            const labels = top.map(r => (r.username || r.user_id || '?').toString().slice(0, 18));
            const values = top.map(r => Number(r.message_count ?? r.total_message_count ?? 0));
            charts[canvasId] = new Chart(el, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [{ label, data: values, backgroundColor: 'rgba(40,167,69,0.65)', borderColor: '#28a745', borderWidth: 1 }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#d1d5db' }, grid: { color: 'rgba(255,255,255,0.08)' } },
                        y: { ticks: { color: '#e5e7eb' }, grid: { display: false } }
                    }
                }
            });
        }

        function loadCounts(query, onSuccess, onFail, idx) {
            idx = idx || 0;
            if (idx >= DATA_SOURCES.length) return onFail();
            $.getJSON(DATA_SOURCES[idx](query || ''))
                .done(onSuccess)
                .fail(xhr => {
                    if (xhr && xhr.responseText && xhr.responseText.indexOf('<?php') === 0) {
                        loadCounts(query, onSuccess, onFail, idx + 1);
                    } else {
                        loadCounts(query, onSuccess, onFail, idx + 1);
                    }
                });
        }

        function rerenderAll() {
            if (!store.lastPayload) return;
            paintDashboard(store.lastPayload, false);
        }

        function paintDashboard(res, isError) {
            store.lastPayload = res;
            store.loadFailed = !!isError;
            const apiError = isError || res?.meta?.api_error;
            const tgPrev = buildPrevRankMap(res.telegram?.daily_previous);
            const dcPrev = buildPrevRankMap(res.discord?.daily_previous);

            if (res.timestamp) {
                const next = new Date(Date.now() + 300000).toLocaleTimeString();
                $('#lastUpdated').text(`Updated: ${res.timestamp} · Auto-refresh ~5 min (next ~${next})`);
            }

            renderTable(res.telegram?.daily, '#tg_daily', { platform: 'telegram', period: 'daily', prevMap: tgPrev, apiError });
            renderTable(res.telegram?.monthly, '#tg_monthly', { platform: 'telegram', period: 'monthly', apiError });
            renderTable(res.discord?.daily, '#dc_daily', { platform: 'discord', period: 'daily', prevMap: dcPrev, apiError });
            renderTable(res.discord?.monthly, '#dc_monthly', { platform: 'discord', period: 'monthly', apiError });

            renderBarChart('chartTgDaily', res.telegram?.daily, 'Today');
            renderBarChart('chartTgMonthly', res.telegram?.monthly, 'Month');
            renderBarChart('chartDcDaily', res.discord?.daily, 'Today');
            renderBarChart('chartDcMonthly', res.discord?.monthly, 'Month');

            if (store.customRange) {
                renderTable(res.telegram?.range, '#custom_tg', { platform: 'telegram', period: 'custom', apiError });
                renderTable(res.discord?.range, '#custom_dc', { platform: 'discord', period: 'custom', apiError });
                renderBarChart('chartCustomTg', res.telegram?.range, 'Range TG');
                renderBarChart('chartCustomDc', res.discord?.range, 'Range DC');
            }
        }

        function updateAll() {
            $('#tg_daily, #tg_monthly, #dc_daily, #dc_monthly').html('<div class="state-box state-loading">Updating…</div>');
            store.customRange = null;
            loadCounts('', res => paintDashboard(res, false), () => {
                paintDashboard({ telegram: {}, discord: {}, meta: { api_error: true } }, true);
            });
        }

        function loadCustom(start, end) {
            if (!start || !end) return alert('Pick both dates');
            store.customRange = { start, end };
            $('#custom_tg, #custom_dc').html('<div class="state-box state-loading">Loading…</div>');
            const q = `?start_date=${start}&end_date=${end}`;
            loadCounts(q, res => paintDashboard(res, false), () => {
                $('#custom_tg, #custom_dc').html(emptyMessage({ platform: 'telegram', period: 'custom', apiError: true }));
            });
        }

        function rowsForExport(key) {
            const map = {
                tg_daily: () => filterRows(store.lastPayload?.telegram?.daily),
                tg_monthly: () => filterRows(store.lastPayload?.telegram?.monthly),
                dc_daily: () => filterRows(store.lastPayload?.discord?.daily),
                dc_monthly: () => filterRows(store.lastPayload?.discord?.monthly),
                custom_tg: () => filterRows(store.lastPayload?.telegram?.range),
                custom_dc: () => filterRows(store.lastPayload?.discord?.range),
            };
            return (map[key] || (() => []))();
        }

        function exportCsv(key, label) {
            const rows = rowsForExport(key);
            if (!rows.length) return alert('Nothing to export for this section (empty or filtered out).');
            const showTrend = key.endsWith('_daily') && !key.startsWith('custom');
            const prevKey = key.startsWith('dc') ? 'discord' : 'telegram';
            const prevMap = showTrend ? buildPrevRankMap(store.lastPayload?.[prevKey]?.daily_previous) : {};

            const header = ['Rank', 'User ID', 'Username', 'Messages', 'Trend vs yesterday', 'Platform', 'Period', 'Exported At'];
            const lines = [header.join(',')];
            const period = key.includes('monthly') ? 'monthly' : key.includes('custom') ? `range ${store.customRange?.start || ''} to ${store.customRange?.end || ''}` : 'daily';
            const platform = key.startsWith('dc') ? 'Discord' : 'Telegram';
            const ts = store.lastPayload?.timestamp || new Date().toISOString();

            rows.forEach((row, i) => {
                const rank = i + 1;
                const cnt = row.message_count ?? row.total_message_count;
                let trend = '';
                if (showTrend) {
                    const prev = prevMap[String(row.user_id)];
                    if (prev == null) trend = 'NEW';
                    else if (prev > rank) trend = `UP from #${prev}`;
                    else if (prev < rank) trend = `DOWN from #${prev}`;
                    else trend = `SAME #${prev}`;
                }
                const un = `"${String(row.username || '').replace(/"/g, '""')}"`;
                lines.push([rank, row.user_id, un, cnt, `"${trend}"`, platform, `"${label || period}"`, `"${ts}"`].join(','));
            });

            const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `memetorrent-tally-${key}-${new Date().toISOString().slice(0, 10)}.csv`;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        function exportActiveTab() {
            const tab = store.activeTab;
            if (tab === 'Telegram') {
                exportCsv('tg_daily', 'daily');
                exportCsv('tg_monthly', 'monthly');
            } else if (tab === 'Discord') {
                exportCsv('dc_daily', 'daily');
                exportCsv('dc_monthly', 'monthly');
            } else if (store.customRange) {
                exportCsv('custom_tg', 'custom telegram');
                exportCsv('custom_dc', 'custom discord');
            } else {
                alert('Run a custom range search first, or use the per-section CSV buttons.');
            }
        }

        function melbourneToday() {
            return new Intl.DateTimeFormat('en-CA', { timeZone: 'Australia/Melbourne', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
        }

        function openTab(name) {
            store.activeTab = name;
            $('.tabcontent').removeClass('active');
            $('#' + name).addClass('active');
            $('.tablink').removeClass('active');
            $(`.tablink[data-tab="${name}"]`).addClass('active');
            if (name !== 'Custom') updateAll();
        }

        $('.tablink').on('click', function () { openTab($(this).data('tab')); });
        $('#btnRefresh').on('click', () => store.activeTab === 'Custom' && store.customRange
            ? loadCustom(store.customRange.start, store.customRange.end) : updateAll());
        $('#btnExportCsv').on('click', exportActiveTab);
        $('#btnCustomSearch').on('click', () => loadCustom($('#startDate').val(), $('#endDate').val()));
        $('#userSearch').on('input', rerenderAll);
        $('[data-export]').on('click', function () { exportCsv($(this).data('export')); });
        $('[data-preset]').on('click', function () {
            const today = melbourneToday();
            const end = today;
            let start = today;
            if ($(this).data('preset') === '7') {
                const [y, m, d] = today.split('-').map(Number);
                const dt = new Date(Date.UTC(y, m - 1, d - 6));
                start = `${dt.getUTCFullYear()}-${String(dt.getUTCMonth() + 1).padStart(2, '0')}-${String(dt.getUTCDate()).padStart(2, '0')}`;
            } else {
                start = today.slice(0, 8) + '01';
            }
            fpStart.setDate(start);
            fpEnd.setDate(end);
            loadCustom(start, end);
            openTab('Custom');
        });

        const today = melbourneToday();
        fpStart.setDate(today);
        fpEnd.setDate(today);
        updateAll();
        setInterval(updateAll, 300000);
    })();
    </script>
</body>
</html>
