	/* ============================================================

	============================================================ */

	@keyframes graffitiPulse {

	  50%  { transform: translate(-50%, -52%) scale(1.15); }

	.mt-wall-grid {
	  display: grid;
	  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
	  gap: 1.8rem;

	.mt-tile {
	  background: rgba(0,0,0,0.65);
	  border-radius: 20px;
	  padding: 1.8rem;
	  text-align: center;
	  border: 2px solid rgba(0,255,153,0.25);

	  transition: 0.35s ease;
	  position: relative;
	  overflow: hidden;

	/* CLEAN until hovered */
	.mt-tile:hover {
	  transform: translateY(-10px) scale(1.03);
	  border-color: var(--primary-color);
	  box-shadow: 0 0 45px rgba(255,204,0,0.5);

	.icon-wrap i {

	  color: var(--accent-color);
	  text-shadow: 0 0 15px var(--accent-color);

	  color: #ccc;
	  font-size: 0.95rem;

	/* === HYBRID GRAFFITI EFFECT — "drip on hover" === */
	.mt-tile::after {
	  content: "";
	  position: absolute;
	  left: 50%;
	  top: -40px;
	  width: 6px;
	  height: 0px;

	  border-radius: 4px;
	  opacity: 0;
	  transform: translateX(-50%);
	  transition: 0.35s;

	  height: 60px;
	  opacity: 1;
	  filter: drop-shadow(0 0 15px var(--primary-color));

		<script>
		  const canvas = document.getElementById("tokenPulseCanvas");
		  const ctx = canvas.getContext("2d");
		  canvas.width = canvas.offsetWidth;
		  canvas.height = canvas.offsetHeight;

		  let particles = [];

		  function createParticle() {
			const x = canvas.width / 2;
			const y = canvas.height / 2;
			const size = Math.random() * 3 + 2;
			const speed = Math.random() * 2 + 1;
			const angle = Math.random() * 2 * Math.PI;
			particles.push({ x, y, size, speed, angle });
		  }

		  function drawParticles() {
			ctx.clearRect(0, 0, canvas.width, canvas.height);
			particles.forEach((p, i) => {
			  p.x += Math.cos(p.angle) * p.speed;
			  p.y += Math.sin(p.angle) * p.speed;
			  p.size *= 0.96;
			  if (p.size < 0.5) particles.splice(i, 1);
			  ctx.beginPath();
			  ctx.arc(p.x, p.y, p.size, 0, 2 * Math.PI);
			  ctx.fillStyle = "lime";
			  ctx.fill();
			});
		  }

		  function animate() {
			drawParticles();
			requestAnimationFrame(animate);
		  }

		  setInterval(createParticle, 100);
		  animate();

		  function showGrowthFundDetails() {
			alert("Ecosystem is Growing");
		  }
		</script>

let sprayColor = "#00ff99";

function saveState() {
  undoStack.push(sprayCtx.getImageData(0, 0, sprayCanvas.width, sprayCanvas.height));

function undoLast() {
  if (!undoStack.length) return;

}

function spray(x, y) {
  for (let i = 0; i < 18; i++) {

    sprayCtx.arc(
      x + Math.cos(angle) * radius,
      y + Math.sin(angle) * radius,
      1 + Math.random() * 3,
      0, Math.PI * 2
    );
    sprayCtx.fill();
  }
  sprayCtx.globalAlpha = 1;
}

function getPos(e) {
  const rect = sprayCanvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function startSpray() { spraying = true; saveState(); }
function stopSpray()  { spraying = false; }
function drawMove(e)  { if (spraying) spray(...Object.values(getPos(e))); }

function enableStickerGestures(sticker) {
    let startX = 0, startY = 0;
    let origX = 0, origY = 0;

    let startScale = 1;
    let startRotation = 0;

    let pinchStartDist = 0;
    let pinchStartAngle = 0;

    function getTouches(e) {
        return [...e.touches].map(t => ({ x: t.clientX, y: t.clientY }));
    }

    sticker.addEventListener("touchstart", e => {
        e.preventDefault();

        const rect = sticker.getBoundingClientRect();
        origX = rect.left;
        origY = rect.top;

        let t = getTouches(e);
        if (t.length === 1) {
            startX = t[0].x;
            startY = t[0].y;
        }
        else if (t.length === 2) {
            const dx = t[1].x - t[0].x;
            const dy = t[1].y - t[0].y;

            pinchStartDist = Math.hypot(dx, dy);
            pinchStartAngle = Math.atan2(dy, dx);

            startScale = parseFloat(sticker.dataset.scale);
            startRotation = parseFloat(sticker.dataset.rotation);
        }
    }, { passive: false });

    sticker.addEventListener("touchmove", e => {
        e.preventDefault();
        let t = getTouches(e);

        // DRAG MODE
        if (t.length === 1) {
            const dx = t[0].x - startX;
            const dy = t[0].y - startY;

            sticker.style.left = (origX + dx) + "px";
			sticker.style.top  = (origY + dy) + "px";
        }

        // PINCH GESTURES (scale + rotate)
        else if (t.length === 2) {
            const dx = t[1].x - t[0].x;
            const dy = t[1].y - t[0].y;

            const newDist = Math.hypot(dx, dy);
            const newAngle = Math.atan2(dy, dx);

            const scale = startScale * (newDist / pinchStartDist);
            const rotation = startRotation + (newAngle - pinchStartAngle);

            sticker.dataset.scale = scale;
            sticker.dataset.rotation = rotation;

            sticker.style.transform = `scale(${scale}) rotate(${rotation}rad)`;
        }
    }, { passive: false });

 let grabOffsetX = 0;
let grabOffsetY = 0;

sticker.addEventListener("mousedown", e => {
    e.preventDefault();

    const rect = sticker.getBoundingClientRect();

    // True starting point
    startX = e.clientX;
    startY = e.clientY;

    origX = rect.left;
    origY = rect.top;

    // Perfect grab offset
    grabOffsetX = startX - origX;
    grabOffsetY = startY - origY;

    function mouseMove(ev) {
        sticker.style.left = (ev.clientX - grabOffsetX) + "px";
        sticker.style.top  = (ev.clientY - grabOffsetY) + "px";
    }

    function mouseUp() {
        window.removeEventListener("mousemove", mouseMove);
        window.removeEventListener("mouseup", mouseUp);
    }

    window.addEventListener("mousemove", mouseMove);
    window.addEventListener("mouseup", mouseUp);
});


}
