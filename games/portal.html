<html lang="en">
<head>

  <title>PORTAL Dashboard</title>

  <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  font-family: 'Orbitron', sans-serif;
  background: radial-gradient(circle at 20% 20%, #001018, #000000);
  color: #fff;
}

#matrix, #trail {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%; z-index: 0;
}
#matrix { opacity: 0.7; }
body::before {
  content: "";
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(135deg, rgba(0,255,255,0.1), rgba(255,0,255,0.1));
  z-index: 0;
  animation: glowShift 10s infinite alternate;
}
@keyframes glowShift { 0% { filter: hue-rotate(0deg);} 100% { filter: hue-rotate(360deg);} }

header {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 60px;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(0,255,255,0.3);
  color: #0ff; display: flex; justify-content: space-between; align-items: center;
  padding: 0 20px; z-index: 999; text-shadow: 0 0 6px #0ff;
}

/* New Top Navbar Styles */
.nav-container {
  display: flex; justify-content: center; align-items: center;
  flex-grow: 1; margin: 0 20px;
}
.nav-links {
  display: flex; gap: 20px; align-items: center;
}
.nav-links a {
  color: #0ff; text-decoration: none; font-size: 0.9em;
  padding: 8px 12px; border-radius: 6px;
  transition: all 0.3s ease; text-shadow: 0 0 6px #0ff;
}
.nav-links a:hover {
  background: rgba(0,255,255,0.2); box-shadow: 0 0 10px #0ff;
}

/* Hamburger Menu for Mobile */
.nav-toggle {
  display: none; font-size: 1.5em; background: none;
  border: none; color: #0ff; cursor: pointer;
  padding: 5px 10px;
}

/* Sidebar Styles (Unchanged) */
nav.sidebar {
  position: fixed; top: 60px; left: 0;
  width: 200px; height: calc(100% - 60px);
  background: rgba(0,0,0,0.45); backdrop-filter: blur(6px);
  display: flex; flex-direction: column; padding-top: 20px;
  border-right: 1px solid rgba(0,255,255,0.3); z-index: 999;
  transition: transform 0.3s ease;
}
nav.sidebar.hidden { transform: translateX(-100%); }
nav.sidebar a {
  color: #0ff; padding: 12px 20px;
  text-decoration: none; font-size: 0.95em;
  transition: 0.3s; border-left: 2px solid transparent;
}
nav.sidebar a:hover { background: rgba(0,255,255,0.15); border-left: 2px solid #0ff; text-shadow: 0 0 10px #0ff; }

/* Enhanced Button Styles */
.header-buttons {
  display: flex; align-items: center; gap: 10px;
}
.header-button {
  padding: 6px 12px; border-radius: 6px; border: 1px solid #0ff;
  background: rgba(0,255,255,0.2); color: #0ff; font-weight: bold;
  cursor: pointer; transition: all 0.3s ease; font-size: 0.85em;
  display: flex; align-items: center; gap: 5px;
}
.header-button:hover {
  background: rgba(0,255,255,0.4); box-shadow: 0 0 10px #0ff;
}
#wallet-status { background: none; border: none; }
#muteButton { background: #0ff; color: black; }
#muteButton:hover { background: #00e0e0; }
#logoutButton { background: #ff4444; border: 1px solid #ff6666; color: white; }
#logoutButton:hover { background: #ff2222; box-shadow: 0 0 10px #ff6666; }
#sidebar-toggle { background: rgba(0,255,255,0.2); }

/* Main Content */
main {
  margin-left: 200px; margin-top: 60px; padding: 20px;
  height: 100%; z-index: 10; position: relative; display: flex; flex-direction: column;
  transition: margin-left 0.3s ease;
}
main.full-width { margin-left: 0; }

/* Mobile Responsiveness */
@media (max-width: 768px) {
  .nav-container { display: none; }
  .nav-container.active { 
    display: flex; flex-direction: column; position: absolute; top: 60px; left: 0; 
    width: 100%; background: rgba(0,0,0,0.8); padding: 10px; z-index: 998;
  }
  .nav-links { flex-direction: column; gap: 10px; }
  .nav-toggle { display: block; }
  nav.sidebar { width: 100%; transform: translateX(-100%); }
  nav.sidebar.active { transform: translateX(0); }
  main { margin-left: 0; }
  .header-buttons { gap: 5px; }
  .header-button { padding: 5px 8px; font-size: 0.8em; }
}

/* Existing Styles (Unchanged) */
.module {
  background: rgba(0,0,0,0.5); backdrop-filter: blur(8px);
  border: 1px solid rgba(0,255,255,0.4); border-radius: 12px;
  padding: 20px; margin-bottom: 20px;
  box-shadow: 0 0 20px rgba(0,255,255,0.2);
  transition: transform 0.2s ease;
}
.module:hover { transform: translateY(-2px); }
.module h2 { font-size: 1.4em; margin-bottom: 10px; color: #00ffee; text-shadow: 0 0 6px #00ffee; }

.btn-link {
  display: inline-block; margin-top: 10px; padding: 12px 24px;
  color: black; background: linear-gradient(135deg, #0ff, #00aaff);
  font-weight: bold; text-decoration: none; border-radius: 8px;
  box-shadow: 0 0 20px #0ff; margin-right: 10px; transition: all 0.3s ease;
}
.btn-link:hover { background: linear-gradient(135deg, #00ffee, #00ccff); box-shadow: 0 0 30px #0ff; transform: scale(1.05); }

.branding {
  position: fixed; bottom: 15px; left: 50%;
  transform: translateX(-50%); color: #00ffea; font-size: 0.9em;
  text-shadow: 0 0 8px #00ffee; z-index: 999;
}

.module div {
  word-wrap: break-word;
  word-break: break-all;
  overflow-wrap: anywhere;
}

#me-wallet {
  display: block;
  font-family: monospace;
  font-size: 0.85em;
  line-height: 1.4;
  word-wrap: break-word;
  overflow-wrap: anywhere;
}

/* Neon glowing style for profile bio textarea */
#profile-bio {
  background: rgba(0,0,0,0.6);
  border: 1px solid #0ff;
  border-radius: 8px;
  color: #0ff;
  font-family: 'Orbitron', sans-serif;
  font-size: 0.9em;
  padding: 8px 10px;
  outline: none;
  resize: none;
  box-shadow: 0 0 8px rgba(0,255,255,0.5);
  transition: all 0.3s ease;
}

#profile-bio:focus {
  border-color: #ff00ff;
  box-shadow: 0 0 12px rgba(255,0,255,0.7);
}

/* Style for the Save button */
.profile-extra .btn.success {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 18px;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  background: linear-gradient(135deg, #0ff, #00aaff);
  color: black;
  cursor: pointer;
  box-shadow: 0 0 20px #0ff;
  transition: all 0.3s ease;
}

.profile-extra .btn.success:hover {
  background: linear-gradient(135deg, #00ffee, #00ccff);
  box-shadow: 0 0 30px #0ff;
  transform: scale(1.05);
}

.profile-extra .btn.cancel {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 18px;
  font-weight: bold;
  border: none;
  border-radius: 8px;
  background: #555;
  color: white;
  cursor: pointer;
  transition: all 0.3s ease;
}

.profile-extra .btn.cancel:hover {
  background: #777;
}

.friend-cards {
  display: flex; flex-wrap: wrap; gap: 10px;
}

.friend-card {
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(0,255,255,0.3);
  border-radius: 8px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  box-shadow: 0 0 10px rgba(0,255,255,0.2);
  position: relative; flex: 0 0 calc(25% - 7.5px);
}
@media (max-width: 1024px) { .friend-card { flex: 0 0 calc(33.33% - 6.67px); } }
@media (max-width: 720px) { .friend-card { flex: 0 0 calc(50% - 5px); } }
@media (max-width: 480px) { .friend-card { flex: 0 0 100%; } }

.friend-card img {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  margin-bottom: 8px;
  border: 1px solid #0ff;
}

.friend-actions {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  z-index: 1;
}

.friend-actions .btn {
  flex: 0;
  font-size: 1.2em;
  padding: 4px;
  width: 28px;
  height: 28px;
  border-radius: 4px;
  cursor: pointer;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
}

.friend-actions .btn.success {
  background: linear-gradient(135deg, #0ff, #00aaff);
  color: black;
  box-shadow: 0 0 6px #0ff;
}

.friend-actions .btn.success:hover {
  background: linear-gradient(135deg, #00ffee, #00ccff);
}

.friend-actions .btn.cancel {
  background: #444;
  color: white;
}

.friend-actions .btn.cancel:hover {
  background: #666;
}

.friend-actions .btn.block {
  background: #ff4444;
  color: white;
  box-shadow: 0 0 6px #ff4444;
}

.friend-actions .btn.block:hover {
  background: #ff2222;
}

.friend-actions .btn.report {
  background: #ffaa00;
  color: black;
  box-shadow: 0 0 6px #ffaa00;
}

.friend-actions .btn.report:hover {
  background: #ffcc00;
}

.friend-actions .btn.submit-report {
  background: #ffaa00;
  color: black;
  box-shadow: 0 0 6px #ffaa00;
  font-size: 0.8em;
  width: auto;
  padding: 4px 8px;
}

.friend-actions .btn.submit-report:hover {
  background: #ffcc00;
}

.friend-actions .btn.cancel-report {
  background: #444;
  color: white;
  font-size: 0.8em;
  width: auto;
  padding: 4px 8px;
}

.friend-actions .btn.cancel-report:hover {
  background: #666;
}

.friend-actions .btn[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
}

.report-form {
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  background: rgba(0,0,0,0.8);
  border: 1px solid #0ff;
  border-radius: 4px;
  padding: 8px;
  z-index: 10;
  margin-top: 5px;
}

.report-form select {
  width: 100%;
  padding: 4px;
  background: #222;
  color: #0ff;
  border: 1px solid #0ff;
  border-radius: 4px;
  font-family: 'Orbitron', sans-serif;
}

.report-form-buttons {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  justify-content: center;
}

.report-other {
  width: 100%;
  padding: 6px;
  margin-top: 5px;
  border: 1px solid #0ff;
  border-radius: 4px;
  background: rgba(0,0,0,0.6);
  color: #0ff;
  font-family: 'Orbitron', sans-serif;
}

.friends-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
}

.friends-tabs span {
  font-weight: bold;
  color: white;
  text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
}

.tab-btn.active span {
  color: black;
  text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
}

.tab-btn {
  padding: 8px 16px;
  border: 1px solid #0ff;
  border-radius: 8px;
  background: rgba(0,0,0,0.5);
  color: #0ff;
  cursor: pointer;
}

.tab-btn.active {
  background: linear-gradient(135deg, #00ffee, #00ccff);
  color: black;
  box-shadow: 0 0 15px #00ffee;
}

.msg-tabs {
  display: flex;
  gap: 12px;
  margin-bottom: 12px;
}
.msg-tab {
  padding: 8px 16px;
  border: 1px solid #0ff;
  border-radius: 6px;
  background: rgba(0,0,0,0.5);
  color: #0ff;
  cursor: pointer;
  font-weight: bold;
  text-shadow: 0 0 6px #0ff;
}
.msg-tab.active {
  background: linear-gradient(135deg, #0ff, #00aaff);
  color: black;
  box-shadow: 0 0 15px #0ff;
}

.msg-conversation {
  background: rgba(0,0,0,0.6);
  border: 1px solid rgba(0,255,255,0.3);
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 10px;
}
.msg-conversation h3 {
  color: #0ff;
  margin-bottom: 10px;
}

.msg-conversation .msg-list {
  max-height: 400px;
  overflow-y: auto !important;
  padding-right: 12px;
  box-sizing: border-box;
}

/* Firefox */
.msg-conversation .msg-list {
  scrollbar-width: thin;
  scrollbar-color: #1e3a8a #e5e7eb !important;
}

/* WebKit (Chrome, Safari, Edge) */
.msg-conversation .msg-list::-webkit-scrollbar {
  width: 10px !important;
}

.msg-conversation .msg-list::-webkit-scrollbar-track {
  background: #e5e7eb !important;
  border-radius: 5px !important;
  box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.2) !important;
}

.msg-conversation .msg-list::-webkit-scrollbar-thumb {
  background: #1e3a8a !important;
  border-radius: 5px !important;
  border: 2px solid #e5e7eb !important;
}

.msg-conversation .msg-list::-webkit-scrollbar-thumb:hover {
  background: #1e40af !important;
}

.msg-item {
  display: flex;
  flex-direction: row;
  align-items: flex-start;
  margin-bottom: 8px;
  padding: 8px;
  border-radius: 8px;
}
.msg-item.sent {
  justify-content: flex-end;
  background: rgba(0,255,255,0.15);
}
.msg-item.received {
  justify-content: flex-start;
  background: rgba(0,0,0,0.3);
}
.msg-item .avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  margin: 0 8px;
}
.msg-item .content-wrapper {
  max-width: 70%;
}
.msg-item .name {
  font-weight: bold;
  font-size: 0.9em;
  margin-bottom: 4px;
}
.msg-item .content {
  word-wrap: break-word;
}
.msg-item .timestamp {
  font-size: 0.75em;
  opacity: 0.6;
  margin-top: 4px;
}
.reply-form {
  display: none;
  margin-top: 10px;
}
.reply-form textarea {
  width: 100%;
  height: 60px;
  background: rgba(0,0,0,0.6);
  border: 1px solid #0ff;
  border-radius: 8px;
  color: #0ff;
  padding: 8px;
  font-family: 'Orbitron', sans-serif;
}
.reply-form button {
  padding: 5px 10px;
  margin-top: 5px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}
.reply-form .send-btn {
  background: #007bff;
  color: white;
}
.reply-form .cancel-btn {
  background: #555;
  color: white;
  margin-left: 5px;
}

.chat-module {
  display: flex;
  background: #2f3136;
  border-radius: 8px;
  height: calc(100vh - 100px);
  box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
}

.chat-sidebar {
  width: 240px;
  background: #202225;
  padding: 10px;
  border-right: 1px solid #1a1c1e;
  overflow-y: auto;
}

.chat-sidebar h3 {
  color: #b9bbbe;
  font-size: 0.9em;
  text-transform: uppercase;
  margin: 10px 0 5px;
  padding-left: 10px;
}

.chat-channel {
  display: flex;
  align-items: center;
  padding: 8px 10px;
  color: #b9bbbe;
  font-size: 0.95em;
  border-radius: 4px;
  cursor: pointer;
  margin: 2px 0;
}

.chat-channel:hover {
  background: #35383c;
  color: #fff;
}

.chat-channel.active {
  background: #5865f2;
  color: #fff;
}

.chat-channel .icon {
  margin-right: 8px;
  font-size: 1.1em;
}

.chat-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #36393f;
}

.chat-header {
  padding: 10px;
  border-bottom: 1px solid #1a1c1e;
  background: #2f3136;
  color: #fff;
  font-size: 1.1em;
  font-weight: bold;
}

.chat-messages {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #1e3a8a #e5e7eb;
}

.chat-messages::-webkit-scrollbar {
  width: 8px;
}

.chat-messages::-webkit-scrollbar-track {
  background: #e5e7eb;
  border-radius: 4px;
}

.chat-messages::-webkit-scrollbar-thumb {
  background: #1e3a8a;
  border-radius: 4px;
}

.chat-messages::-webkit-scrollbar-thumb:hover {
  background: #1e40af;
}

.chat-message {
  display: flex;
  align-items: flex-start;
  margin-bottom: 10px;
  padding: 5px 10px;
}

.chat-message.sent {
  justify-content: flex-end;
}

.chat-message.received {
  justify-content: flex-start;
}

.chat-message .avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  margin: 0 10px;
}

.chat-message .content-wrapper {
  max-width: 70%;
  background: #40444b;
  border-radius: 4px;
  padding: 8px 12px;
}

.chat-message.sent .content-wrapper {
  background: #5865f2;
  color: #fff;
}

.chat-message .name {
  font-weight: bold;
  font-size: 0.9em;
  color: #b9bbbe;
}

.chat-message.sent .name {
  color: #fff;
}

.chat-message .content {
  word-wrap: break-word;
  font-size: 0.95em;
}

.chat-message .timestamp {
  font-size: 0.75em;
  color: #72767d;
  margin-top: 4px;
}

.chat-input-area {
  padding: 10px;
  border-top: 1px solid #1a1c1e;
  background: #2f3136;
}

.chat-input-area input {
  width: calc(100% - 90px);
  padding: 10px;
  background: #40444b;
  border: 1px solid #1a1c1e;
  border-radius: 4px;
  color: #fff;
  font-family: 'Orbitron', sans-serif;
}

.chat-input-area button {
  width: 80px;
  margin-left: 10px;
  padding: 10px;
  background: #5865f2;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-weight: bold;
}

.chat-users {
  width: 200px;
  background: #2f3136;
  border-left: 1px solid #1a1c1e;
  padding: 10px;
  overflow-y: auto;
}

.chat-users h4 {
  color: #b9bbbe;
  font-size: 0.9em;
  margin-bottom: 10px;
}

.chat-user {
  color: #dcddde;
  font-size: 0.9em;
  padding: 5px;
  display: flex;
  align-items: center;
}

.chat-user .status {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #3ba55c;
  margin-right: 8px;
}

.group-create {
  margin-top: 10px;
  padding: 10px;
  background: #2f3136;
  border-top: 1px solid #1a1c1e;
}

.group-create input {
  width: 70%;
  padding: 8px;
  background: #40444b;
  border: 1px solid #1a1c1e;
  border-radius: 4px;
  color: #fff;
}

.group-create button {
  padding: 8px 16px;
  background: #5865f2;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-weight: bold;
}

.chat-channel[data-chat-tab^="group-"] .icon { content: "👥"; }
.chat-channel[data-chat-tab^="private-"] .icon { content: "📩"; }

.chat-leave-btn {
  margin-left: auto;
  padding: 2px 6px;
  background: #f04747;
  color: #fff;
  border: none;
  border-radius: 4px;
  font-size: 0.7em;
  cursor: pointer;
}

.chat-leave-btn:hover {
  background: #d32f2f;
}

.p2e-banner {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(90deg, #ff9f43, #ffd166); color: #0f1216;
  font-weight: 800; padding: 10px 14px; font-size: 14px; position: sticky;
  top: 0; z-index: 30; box-shadow: 0 10px 25px rgba(0,0,0,0.35);
}
.earnings {
  max-width: 1200px; margin: 6px auto 0; padding: 0 16px 6px;
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  justify-content: space-between;
}
.earn-chip {
  background: rgba(76, 194, 255, 0.12); border: 1px solid rgba(76, 194, 255, 0.25);
  color: #cfeeff; padding: 8px 12px; border-radius: 999px; font-weight: 700; font-size: 13px;
}
.info-chip {
  color: #9aa3b2; font-size: 12px;
}
.section {
  max-width: 1200px; margin: 10px auto; padding: 0 16px;
}
.section h3 {
  margin: 10px 0 14px; font-size: 18px; letter-spacing: 0.3px;
  font-weight: 800; color: #f6f8fc; font-family: 'Rajdhani', sans-serif;

function getContrastColor(hex) {
  if (!hex) return '#fff';
  hex = hex.replace('#', '');
  if (hex.length === 3) hex = hex.split('').map(x => x + x).join('');
  const r = parseInt(hex.substr(0, 2), 16);
  const g = parseInt(hex.substr(2, 2), 16);
  const b = parseInt(hex.substr(4, 2), 16);
  const brightness = (r * 299 + g * 587 + b * 114) / 1000;
  return brightness > 155 ? '#000' : '#fff';
}

let isLoadingModule = false;
document.querySelectorAll('nav.sidebar a, .nav-links a').forEach(link => {

  // Matrix rain
  const matrixCanvas = document.getElementById('matrix');
  const mCtx = matrixCanvas.getContext('2d');
  matrixCanvas.width = window.innerWidth;
  matrixCanvas.height = window.innerHeight;
  const cols = Math.floor(matrixCanvas.width / 20);
  const drops = Array(cols).fill(1);
  const chars = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿ0123456789ﾊﾐﾑﾒﾓ";
  function drawMatrix() {
    mCtx.fillStyle = "rgba(0, 0, 0, 0.05)";
    mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
    mCtx.fillStyle = "#0f0";
    mCtx.font = "16px monospace";
    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      const x = i * 20;
      const y = drops[i] * 20;
      mCtx.fillText(text, x, y);
      if (y > matrixCanvas.height && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
    requestAnimationFrame(drawMatrix);
  }
  drawMatrix();

async function fetchRacerScores() {
  const mode = document.getElementById('racer-mode')?.value || 'race';
  const track_id = document.getElementById('racer-track')?.value || 0;
  const difficulty = document.getElementById('racer-difficulty')?.value || 0;
  const tbody = document.getElementById('racer-scores');

  if (!tbody) {
    console.warn("⚠️ Racer scoreboard elements not loaded yet.");
    return;
  }

  tbody.innerHTML = '<tr><td colspan="3" style="color:var(--muted)">Loading...</td></tr>';

  try {
    const url = new URL('https://futuret3ch.pythonanywhere.com/api/scores/racer');
    url.searchParams.append('mode', mode);
    url.searchParams.append('track_id', track_id);
    url.searchParams.append('difficulty', difficulty);

    console.log("Fetching scoreboard:", url.toString());

    const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const raw = await response.json();
    const scores = Array.isArray(raw) ? raw : raw.scores || [];

    if (!scores.length) {
      tbody.innerHTML = '<tr><td colspan="3">No scores available.</td></tr>';
      return;
    }

    tbody.innerHTML = scores.map((entry, idx) => `
      <tr>
        <td>${idx + 1}</td>
        <td>${entry.username || entry.player || 'N/A'}</td>
        <td>${entry.time || entry.score || 0}</td>
      </tr>
    `).join('');

  } catch (err) {
    console.error("Scoreboard fetch error:", err);
    tbody.innerHTML = `
      <tr><td>1</td><td>NeoMeme</td><td>42.31</td></tr>
      <tr><td>2</td><td>ByteBlaster</td><td>44.12</td></tr>
      <tr><td>3</td><td>GlitchQueen</td><td>45.73</td></tr>
    `;
  }
}

      return;
    }

      return;

    const chatSidebar = document.querySelector(".chat-sidebar");
    if (!chatSidebar) {
      console.error("Chat sidebar not found");
      return;
    }

    chatSidebar.addEventListener("click", (e) => {

      if (!btn) return;

      document.querySelectorAll(".chat-channel").forEach(b => b.classList.remove("active"));

      document.getElementById("chat-header").textContent = btn.textContent.replace("Leave", "").trim();

      document.querySelectorAll(".chat-leave-btn").forEach(b => b.remove());

      if (btn.dataset.chatTab.startsWith("group-")) {
        const leaveBtn = document.createElement("button");

        leaveBtn.textContent = "Leave";
        leaveBtn.onclick = () => leaveGroup(btn.dataset.chatTab.replace("group-", ""));

        const leaveBtn = document.createElement("button");

        leaveBtn.textContent = "End";
        leaveBtn.onclick = () => leavePrivateChat(btn.dataset.chatTab.replace("private-", ""));

      lastMessageIds[currentChatTab] = lastMessageIds[currentChatTab] || 0;
      document.getElementById("messages-list").innerHTML = "";

    });

    const sendButton = document.querySelector(".chat-input-area button");
    const chatInput = document.getElementById("chat-input");

async function sendChatMessage() {
  const input = document.getElementById("chat-input");
  if (!input) return console.error("Chat input missing");

  const content = input.value.trim();
  if (!content) return alert("❌ Enter message");

  if (!currentUser.id) return alert("❌ Not authenticated");

  console.log("Sending message to tab:", currentChatTab);
  try {
    const res = await fetch(`/games/api/chat/send_chat.php?tab=${currentChatTab}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({
        content,
        sender_id: currentUser.id,
        sender_name: currentUser.name
      })
    });
    const data = await res.json();
    if (data.success) {
      input.value = "";
      loadChatMessages();
      console.log("Message sent, id:", data.id);
    } else {
      alert("❌ Send failed: " + data.error);
    }
  } catch (err) {
    console.error("Send failed:", err);
    alert("❌ Send failed");
  }
}

async function loadChatMessages() {
  try {
    console.log("Loading messages for tab:", currentChatTab, "since_id:", lastMessageIds[currentChatTab] || 0);
    const res = await fetch(`/games/api/chat/messages.php?tab=${currentChatTab}&since_id=${lastMessageIds[currentChatTab] || 0}`, {
      credentials: "include"
    });
    const data = await res.json();
    if (data.success) {
      data.messages.forEach(msg => {
        if (msg.id > (lastMessageIds[currentChatTab] || 0)) {
          appendChatMessage(msg);
          lastMessageIds[currentChatTab] = Math.max(lastMessageIds[currentChatTab] || 0, msg.id);
        }
      });
    } else {
      console.error("Load messages failed:", data.error);
    }
  } catch (err) {
    console.error("Load messages failed:", err);
  }
}

  if (editorDiv) editorDiv.setAttribute("contenteditable", "true");
  console.log(`✅ Quill initialized on ${selector}`);
  return instance;
}

/* ==========================================================
   📥 LOAD MESSAGES
   ========================================================== */
window.loadMessages = async function (tab = "inbox") {
  const container = document.getElementById("msg-list");
  const newMsgSection = document.querySelector("#msg-new-section");
  if (!container) return;
  container.innerHTML = `<p style="color:#0ff;">Loading ${tab}...</p>`;

  if (newMsgSection) newMsgSection.style.display = tab === "replies" ? "none" : "block";

  try {
    const profileRes = await fetch("/games/api/user/profile.php", { credentials: "include" });
    const profileData = await profileRes.json();
    if (!profileData.success) throw new Error("Profile load failed");
    const me = profileData.profile;
    const myId = parseInt(me.id);

    const [inboxRes, outboxRes] = await Promise.all([
      fetch("/games/api/messages/inbox.php", { credentials: "include" }),
      fetch("/games/api/messages/outbox.php", { credentials: "include" }),
    ]);
    const [inboxData, outboxData] = await Promise.all([inboxRes.json(), outboxRes.json()]);
    const inboxMsgs = inboxData.messages || [];
    const outboxMsgs = outboxData.messages || [];

    let filtered = [];
    if (tab === "inbox") filtered = inboxMsgs.filter((m) => m.receiver_id == myId);
    else if (tab === "sent") filtered = outboxMsgs.filter((m) => m.sender_id == myId);
    else if (tab === "replies") {
      const all = [...inboxMsgs, ...outboxMsgs];
      const map = new Map();
      for (const msg of all) {
        const key = [msg.sender_id, msg.receiver_id].sort().join("-");
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(msg);
      }
      filtered = [...map.values()].flat().sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    }

    if (!filtered.length) {
      container.innerHTML = `<p style="color:#888;">No ${tab} messages.</p>`;
      return;
    }

    filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    container.innerHTML = "";

    for (const m of filtered) {
      const sent = m.sender_id == myId;
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg-item ${sent ? "sent" : "received"}`;
      msgDiv.innerHTML = `
        <div class="content-wrapper">
          <div class="name">${sent ? "You → " + m.receiver_name : m.sender_name}</div>
          <div class="content">${m.content}</div>
          <div class="timestamp">${m.created_at}</div>
        </div>`;
      container.appendChild(msgDiv);
    }
  } catch (err) {
    container.innerHTML = `<p style="color:red;">Error loading messages: ${err.message}</p>`;
  }
};

// Toggle picker
function handleEmojiButton(e) {
  e.stopPropagation();
  const btn = e.currentTarget;

  // Create picker only once
  if (!emojiPickerInstance) {
    // ✅ Use correct component name for browser.js build
    emojiPickerInstance = document.createElement("em-emoji-picker");
    emojiPickerInstance.setAttribute("theme", "dark");
    emojiPickerInstance.style.maxHeight = "380px";
    emojiPickerInstance.style.overflowY = "auto";

    // ✅ Correct event payload for browser.js version
  emojiPickerInstance.addEventListener("emoji-click", (ev) => {
  const char = ev.detail.unicode || ev.detail.emoji?.unicode;
  insertEmoji(char);
});


    emojiPickerContainer.appendChild(emojiPickerInstance);
  }

  // Toggle picker visibility + position
  const visible = emojiPickerContainer.style.display === "block";
  const rect = btn.getBoundingClientRect();
  emojiPickerContainer.style.top = `${rect.bottom + window.scrollY + 8}px`;
  emojiPickerContainer.style.left = `${rect.left + window.scrollX}px`;
  emojiPickerContainer.style.display = visible ? "none" : "block";
}


// Insert emoji into active Quill or textarea
function insertEmoji(char) {
  const target =
    activeEditorEl ||
    document.activeElement.closest(".ql-editor, textarea") ||
    document.querySelector("#msg-content-editor .ql-editor");
  if (!target) return;

  const q = target.__quill || target.closest(".ql-container")?.__quill;
  if (q && typeof q.insertText === "function") {
    const range = q.getSelection(true) || { index: q.getLength() };
    q.insertText(range.index, char, "user");
    q.setSelection(range.index + char.length);
    hideEmojiPicker();
    return;
  }

  if (target.tagName === "TEXTAREA") {
    const start = target.selectionStart || 0;
    const end = target.selectionEnd || 0;
    target.value = target.value.slice(0, start) + char + target.value.slice(end);
    target.selectionStart = target.selectionEnd = start + char.length;
    target.focus();
    hideEmojiPicker();
  }
}

function hideEmojiPicker() {
  if (emojiPickerContainer) emojiPickerContainer.style.display = "none";
}

// Hide picker on outside click
document.addEventListener("click", (e) => {
  if (
    emojiPickerContainer &&
    emojiPickerContainer.style.display === "block" &&
    !emojiPickerContainer.contains(e.target) &&
    !e.target.classList.contains("emoji-btn")
  ) {
    hideEmojiPicker();
  }
});

async function sendMessage() {
  const toSelect = document.getElementById("msg-to");
  const to = toSelect?.value?.trim();

  if (!to) return alert("Please select a friend to message.");
  if (!window.quill) return alert("Message editor not ready.");

  const html = window.quill.root.innerHTML.trim();
  const plain = window.quill.getText().replace(/\s+/g, "").trim();
  const isEmpty = !plain && !/<img|<a|<strong|<em|<u|<p|👍|😀|😂|❤️/i.test(html);
  if (isEmpty || html === "<p><br></p>") return alert("Message cannot be empty.");

  const formData = new FormData();
  formData.append("to", to);
  formData.append("content_b64", btoa(unescape(encodeURIComponent(html))));

  const files = document.getElementById("msg-files");
  if (files && files.files.length) for (const f of files.files) formData.append("files[]", f);

  const res = await fetch("/games/api/messages/send.php", {
    method: "POST",
    credentials: "include",
    body: formData,
  });
  const data = await res.json();
  if (data.success) {
    alert("✅ Message sent!");
    window.quill.root.innerHTML = "";
    loadMessages("sent");
  } else alert("❌ Failed: " + (data.error || "Unknown error"));
}

async function sendConversationMessage(recipientId, convoDiv, content, replyForm, globalForm, replyBtn, currentUser, messageId = null) {
  if (!content) {
    console.warn("Empty content in reply");
    alert("❌ Please enter a message");
    replyForm.querySelector(".reply-content").focus();
    return;
  }

  try {
    const sendBtn = replyForm.querySelector(".send-btn");
    sendBtn.disabled = true;

    console.log("Sending conversation message to recipient_id:", recipientId, "content:", content, "messageId:", messageId);

    // Encode content to Base64
    const content_b64 = btoa(unescape(encodeURIComponent(content.trim())));

    // Prepare x-www-form-urlencoded data
    const params = new URLSearchParams();
    params.append("receiver_id", Number.isInteger(parseInt(recipientId)) ? parseInt(recipientId) : 0);
    params.append("content_b64", content_b64);
    if (messageId) params.append("in_reply_to", parseInt(messageId));

    // Mark message as read if replying to an unread message
    if (messageId) {
      const markReadParams = new URLSearchParams();
      markReadParams.append("message_id", parseInt(messageId));
      const markReadRes = await fetch("https://memetorrent.futuret3ch.com.au/games/api/messages/mark_read.php", {
        method: "POST",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
          "Accept": "application/json"
        },
        credentials: "include",
        body: markReadParams.toString()
      }).catch(err => {
        console.error("Mark read fetch error:", err);
        throw new Error("Network error: Unable to mark message as read");
      });
      const markReadText = await markReadRes.text();
      let markReadData;
      try {
        markReadData = JSON.parse(markReadText);
        console.log("Mark read response:", markReadData);
        if (!markReadData.success) {
          console.warn("Failed to mark message as read:", markReadData.error);
        }
      } catch (e) {
        console.error("Invalid JSON response from mark_read.php:", markReadText);
      }
    }

    // Send message
    const res = await fetch("https://memetorrent.futuret3ch.com.au/games/api/messages/send.php", {
      method: "POST",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded",
        "Accept": "application/json"
      },
      credentials: "include",
      body: params.toString()
    }).catch(err => {
      console.error("Fetch error:", err);
      throw new Error("Network error: Unable to send message");
    });

    console.log(`send.php response status:`, res.status);
    const text = await res.text();
    console.log("Raw response from send.php:", text);

    let data;
    try {
      data = JSON.parse(text);
      console.log("Parsed send response:", data);
    } catch (e) {
      console.error("Invalid JSON response from send.php:", text);
      alert("❌ Message not sent. Server returned non-JSON response (possible ModSecurity block) — check console.");
      return;
    }

    if (data.success) {
      alert("✅ Message sent!");
      replyForm.style.display = "none";
      replyForm.querySelector(".reply-content").value = "";
      globalForm.style.display = "block";
      replyBtn.style.display = "block";

      const inboxTab = document.querySelector(".msg-tab[data-tab='inbox']");
      const sentTab = document.querySelector(".msg-tab[data-tab='outbox']");
      const repliesTab = document.querySelector(".msg-tab[data-tab='replies']");
      if (inboxTab && sentTab && repliesTab) {
        inboxTab.classList.remove("active");
        sentTab.classList.remove("active");
        repliesTab.classList.add("active");
        console.log("Switched to replies tab after sending conversation message");
      } else {
        console.warn("Message tabs not found, forcing replies load");
      }

      setTimeout(async () => {
        await loadMessages("replies");
        let newConvoDiv = document.getElementById("msg-list").querySelector(`.msg-conversation[data-user-id="${recipientId}"]`);
        if (!newConvoDiv) {
          newConvoDiv = document.createElement("div");
          newConvoDiv.className = "msg-conversation";
          newConvoDiv.setAttribute("data-user-id", recipientId);
          newConvoDiv.innerHTML = `
            <div style="display:flex; align-items:center; gap:10px;">
              <img src="/games/default-avatar.png" width="48" style="border-radius:50%;"/>
              <h3>${recipientId === "2" ? "futuret3ch" : "User #" + recipientId}</h3>
            </div>
            <div class="msg-list"></div>
            <button class="reply-btn" data-recipient-id="${recipientId}" style="margin-top:10px;padding:5px 10px;background:#007bff;color:white;border:none;border-radius:4px;cursor:pointer;">
              Reply
            </button>
            <div class="reply-form">
              <textarea class="reply-content" placeholder="Type your reply..."></textarea>
              <button class="send-btn">Send</button>
              <button class="cancel-btn">Cancel</button>
            </div>
          `;
          document.getElementById("msg-list").prepend(newConvoDiv);
          newConvoDiv.querySelector(".reply-btn").addEventListener("click", () => {
            globalForm.style.display = "none";
            newConvoDiv.querySelector(".reply-form").style.display = "block";
            newConvoDiv.querySelector(".reply-btn").style.display = "none";
            newConvoDiv.querySelector(".reply-content").focus();
            console.log(`Reply button clicked, showing reply form for recipient ID: ${recipientId}`);
            const sendBtn = newConvoDiv.querySelector(".send-btn");
            const cancelBtn = newConvoDiv.querySelector(".cancel-btn");
            sendBtn.onclick = () => sendConversationMessage(recipientId, newConvoDiv, newConvoDiv.querySelector(".reply-content").value.trim(), newConvoDiv.querySelector(".reply-form"), globalForm, newConvoDiv.querySelector(".reply-btn"), currentUser);
            cancelBtn.onclick = () => {
              newConvoDiv.querySelector(".reply-form").style.display = "none";
              globalForm.style.display = "block";
              newConvoDiv.querySelector(".reply-btn").style.display = "block";
              newConvoDiv.querySelector(".reply-content").value = "";
              console.log("Reply cancelled, restored global form and reply button");
            };
          });
        }

        const msgList = newConvoDiv.querySelector(".msg-list");
        const newMessage = document.createElement("div");
        newMessage.className = "msg-item sent";
        newMessage.innerHTML = `
          <input type="checkbox" class="msg-checkbox" data-message-id="${data.message_id || 'new'}" style="margin-right: 8px;">
          <img src="${currentUser.avatar}" class="avatar" alt="${currentUser.name}"/>
          <div class="content-wrapper">
            <div class="name">${currentUser.name}</div>
            <div class="content">${content}</div>
            <div class="timestamp">${new Date().toLocaleString()}</div>
          </div>
          <button class="delete-btn" data-message-id="${data.message_id || 'new'}" style="padding: 2px 6px; background: #ff4444; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 0.7em; margin-left: 5px;">Delete</button>
        `;
        msgList.appendChild(newMessage);
        msgList.scrollTop = msgList.scrollHeight;

        // Reattach delete button listener
        newMessage.querySelector(".delete-btn").addEventListener("click", async () => {
          if (confirm("Delete this message?")) {
            try {
              const deleteParams = new URLSearchParams();
              deleteParams.append("message_id", parseInt(data.message_id));
              const res = await fetch("https://memetorrent.futuret3ch.com.au/games/api/messages/delete.php", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                credentials: "include",
                body: deleteParams.toString()
              });
              const deleteData = await res.json();
              if (deleteData.success) {
                const msgItem = newMessage;
                const convoDiv = msgItem.closest(".msg-conversation");
                msgItem.remove();
                console.log("Message deleted:", data.message_id);
                if (!convoDiv.querySelector(".msg-item")) {
                  convoDiv.remove();
                  console.log(`Removed empty conversation for user ID: ${convoDiv.dataset.userId}`);
                }
                updateDeleteButton();
                if (!document.getElementById("msg-list").querySelector(".msg-conversation")) {
                  document.getElementById("msg-list").innerHTML = `<p>No messages in ${msgCurrentTab}.</p>`;
                }
              } else {
                alert("❌ Delete failed: " + deleteData.error);
              }
            } catch (err) {
              console.error("Delete error:", err);
              alert("❌ Delete failed: " + err.message);
            }
          }
        });

        // Reattach checkbox listener
        newMessage.querySelector(".msg-checkbox").addEventListener("change", updateDeleteButton);
      }, 100);
    } else {
      console.error("Send message failed with error:", data.error);
      alert("❌ Failed to send message: " + (data.error || data.message || "Failed to send"));
    }
  } catch (err) {
    console.error("Send conversation message failed:", err);
    alert("❌ Failed to send message: " + err.message);
  } finally {
    const sendBtn = replyForm.querySelector(".send-btn");
    if (sendBtn) sendBtn.disabled = false;
  }
}

async function reportFriend(relationId, btn) {
  const card = btn.closest('.friend-card');
  const reasonSelect = card.querySelector('.report-reason');
  let reason = reasonSelect ? reasonSelect.value.trim() : "";
  const otherInput = card.querySelector('.report-other');

  if (reason === "other" && otherInput) {
    reason = otherInput.value.trim();
    if (!reason) {
      alert("❌ Please specify a reason for 'Other'.");
      return;
    }
  } else if (!reason) {
    alert("❌ Please select a reason to report this user.");
    return;
  }

  try {
    const res = await fetch("/games/api/friends/report.php", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      credentials: "include",
      body: JSON.stringify({ friend_id: relationId, reason })
    });

    const text = await res.text();
    console.log("Raw report.php response:", text);

    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      console.error("Failed to parse JSON:", text);
      alert("❌ Server returned invalid JSON (check console for raw response).");
      return;
    }

    if (data.success) {
      for (let tab of ["accepted", "pending", "blocked"]) {
        const friend = friendsData[tab].find(f => f.relation_id === relationId);
        if (friend) friend.reported = 1;
      }
      renderFriends(currentTab);
      alert("⚠️ User reported");
    } else {
      alert("❌ " + (data.error || "Unknown error"));
    }
  } catch (err) {
    console.error("reportFriend failed:", err);
    alert("❌ Failed to report friend: " + err.message);
  }
}

// Apply theme styles
function applyTheme(theme) {
  const dashboard = document.querySelector('.dashboard');
  const themes = {
    matrix: { background: '#000', color: '#0f0', borderColor: '#0ff' },
    crypto: { background: '#1a1a3d', color: '#00f', borderColor: '#00f' },
    cosmic: { background: '#0a0a23', color: '#fff', borderColor: '#ff0' },
    retro: { background: '#1c2526', color: '#ff69b4', borderColor: '#ff69b4' }
  };
  const { background, color, borderColor } = themes[theme] || themes.matrix;
  dashboard.classList.remove('matrix-theme', 'crypto-theme', 'cosmic-theme', 'retro-theme');
  dashboard.classList.add(`${theme}-theme`);
  dashboard.style.background = background;
  dashboard.style.color = color;
  document.querySelectorAll('.module').forEach(module => {
    module.style.borderColor = borderColor;
  });
  updateThemeEffects(theme);
}

// Theme-specific effects
function updateThemeEffects(theme) {
  const matrixCanvas = document.getElementById("matrix");
  const cosmicCanvas = document.getElementById("cosmic-particles");
  if (matrixCanvas) matrixCanvas.style.display = theme === "matrix" ? "block" : "none";
  if (cosmicCanvas) cosmicCanvas.style.display = theme === "cosmic" ? "block" : "none";
  
  document.body.style.background = theme === "crypto" ? "linear-gradient(135deg, #00ff00, #00aaff)" :
                                  theme === "cosmic" ? "radial-gradient(circle, #1a0033, #000033)" :
                                  theme === "retro" ? "linear-gradient(135deg, #1c2526, #2f4f4f)" : "#000";
  if (theme === "cosmic") addCosmicParticles();
}

// Cosmic Dust particle effect
function addCosmicParticles() {
  const existingCanvas = document.getElementById("cosmic-particles");
  if (existingCanvas) return;

  const canvas = document.createElement("canvas");
  canvas.id = "cosmic-particles";
  canvas.style.position = "fixed";
  canvas.style.top = "0";
  canvas.style.left = "0";
  canvas.style.zIndex = "0";
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  document.body.appendChild(canvas);

  const ctx = canvas.getContext("2d");
  const particles = Array(100).fill().map(() => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 3 + 1,
    speedX: Math.random() * 2 - 1,
    speedY: Math.random() * 2 - 1,
  }));

  function animateParticles() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.1)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ffffff";
    particles.forEach(p => {
      p.x += p.speedX;
      p.y += p.speedY;
      if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
      if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    });
    requestAnimationFrame(animateParticles);
  }
  animateParticles();
}

// Daily spin-to-win
function initSpinWheel() {
  console.log("Initializing spin wheel...");
  const spinButton = document.getElementById("spin-button");
  const spinResult = document.getElementById("spin-result");
  const canvas = document.getElementById("spin-wheel");
  if (!spinButton || !spinResult || !canvas) {
    console.error("Spin wheel elements not found:", { spinButton, spinResult, canvas });
    return;
  }

  const ctx = canvas.getContext("2d");
  const winnableItems = storeItems.filter(i => i.method === 'win' && !i.event);
  const segments = [...winnableItems.map(i => ({ name: i.name, id: i.id })), ...Array(4).fill({ name: "No Prize", id: null })];
  const colors = ["#00ffee", "#ff00ff", "#00aaff", "#ff4444", "#33cc33", "#ffaa00", "#9933ff", "#ff9900"];
  const segmentAngle = (2 * Math.PI) / segments.length;
  let currentAngle = 0;
  let isSpinning = false;

  // Check last spin time
  const lastSpin = localStorage.getItem("lastSpin");
  const now = new Date();
  const today = now.toISOString().split('T')[0];
  spinButton.disabled = false; // Allow spinning for testing
  console.log("Last spin date:", lastSpin, "Today:", today, "Button disabled:", spinButton.disabled);

  // Draw wheel
  function drawWheel() {
    console.log("Drawing wheel");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save();
    ctx.translate(150, 150);
    ctx.rotate(currentAngle);

    segments.forEach((segment, i) => {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, 140, i * segmentAngle, (i + 1) * segmentAngle);
      ctx.fillStyle = colors[i % colors.length];
      ctx.fill();
      ctx.strokeStyle = "#0ff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.rotate(i * segmentAngle + segmentAngle / 2);
      ctx.fillStyle = "#000";
      ctx.font = "bold 14px Orbitron";
      ctx.textAlign = "right";
      ctx.fillText(segment.name, 120, 5);
      ctx.restore();
    });

    ctx.restore();

    // Draw pointer
    ctx.beginPath();
    ctx.moveTo(150, 20);
    ctx.lineTo(140, 40);
    ctx.lineTo(160, 40);
    ctx.fillStyle = "#ff4444";
    ctx.fill();
    ctx.strokeStyle = "#0ff";
    ctx.stroke();
  }

  // Spin animation
  async function spinWheel() {
    if (isSpinning) {
      console.log("Spin already in progress, ignoring");
      return;
    }
    isSpinning = true;
    spinButton.disabled = true;
    spinResult.textContent = "Spinning...";
    console.log("Starting spin");

    try {
      // Mock API response for testing
      const data = { success: true }; // Replace with actual fetch when API is stable
      // const res = await fetch('/games/api/user/profile.php', { credentials: 'include' });
      // const data = await res.json();
      console.log("API response:", data);
      if (!data.success) throw new Error("Not logged in");

      localStorage.setItem("lastSpin", today);
      console.log("Stored lastSpin:", today);
      const spins = Math.floor(Math.random() * 4 + 4) * 360; // 4-8 full spins
      const targetSegment = Math.floor(Math.random() * segments.length);
      const finalAngle = targetSegment * segmentAngle + Math.random() * segmentAngle;
      const totalRotation = spins + finalAngle;
      let startTime = null;

      function animate(time) {
        if (!startTime) startTime = time;
        const progress = (time - startTime) / 3000; // 3-second spin
        const easeOut = 1 - Math.pow(1 - progress, 3); // Ease-out effect
        currentAngle = (easeOut * totalRotation * Math.PI) / 180;

        drawWheel();
        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          const selectedSegment = segments[Math.floor(((currentAngle % (2 * Math.PI)) / segmentAngle + segments.length) % segments.length)];
          console.log("Spin landed on:", selectedSegment);
          if (selectedSegment.id) {
            const userItems = JSON.parse(localStorage.getItem("user-items") || "[]");
            if (!userItems.some(i => i.id == selectedSegment.id)) {
              const item = storeItems.find(i => i.id == selectedSegment.id);
              userItems.push({ ...item, placed: false, x: 0, y: 0 });
              localStorage.setItem("user-items", JSON.stringify(userItems));
              spinResult.textContent = `You won ${selectedSegment.name}!`;
              console.log("Won item:", selectedSegment.name);
              renderActiveItems();
            } else {
              spinResult.textContent = `You already own ${selectedSegment.name}.`;
              console.log("Item already owned:", selectedSegment.name);
            }
          } else {
            spinResult.textContent = "No prize this time. Try again tomorrow!";
            console.log("No prize won");
          }
          spinButton.disabled = false; // Re-enable for testing
        }
      }
      requestAnimationFrame(animate);
    } catch (err) {
      console.error("Spin failed:", err);
      spinResult.textContent = "Spin failed: " + err.message;
      isSpinning = false;
      spinButton.disabled = false; // Re-enable for testing
    }
  }

  spinButton.addEventListener("click", () => {
    console.log("Spin button clicked");
    spinWheel();
  });
  drawWheel();
}

// Enhanced drag-and-drop with touch support
function initDragAndDrop() {
  let draggedItem = null;
  let offsetX, offsetY;

  const startDrag = (e, clientX, clientY) => {
    if (e.target.id.startsWith("dashboard-item-")) {
      draggedItem = e.target;
      draggedItem.style.cursor = "grabbing";
      const rect = draggedItem.getBoundingClientRect();
      offsetX = clientX - rect.left;
      offsetY = clientY - rect.top;
      e.preventDefault();
    }
  };

  const moveDrag = (e, clientX, clientY) => {
    if (draggedItem) {
      const x = Math.max(0, Math.min(clientX - offsetX, window.innerWidth - 100));
      const y = Math.max(0, Math.min(clientY - offsetY, window.innerHeight - 100));
      draggedItem.style.left = `${x}px`;
      draggedItem.style.top = `${y}px`;
    }
  };

  const endDrag = () => {
    if (draggedItem) {
      const itemId = draggedItem.id.replace("dashboard-item-", "");
      const userItems = JSON.parse(localStorage.getItem("user-items") || "[]");
      const item = userItems.find(i => i.id == itemId);
      if (item) {
        item.x = parseInt(draggedItem.style.left);
        item.y = parseInt(draggedItem.style.top);
        item.placed = true;
        localStorage.setItem("user-items", JSON.stringify(userItems));
      }
      draggedItem.style.cursor = "grab";
      draggedItem = null;
    }
  };

  document.addEventListener("mousedown", e => startDrag(e, e.clientX, e.clientY));
  document.addEventListener("mousemove", e => moveDrag(e, e.clientX, e.clientY));
  document.addEventListener("mouseup", endDrag);
  document.addEventListener("touchstart", e => startDrag(e, e.touches[0].clientX, e.touches[0].clientY));
  document.addEventListener("touchmove", e => moveDrag(e, e.touches[0].clientX, e.touches[0].clientY));
  document.addEventListener("touchend", endDrag);
}

// Place item with bounds checking
function placeItem(itemId) {
  const userItems = JSON.parse(localStorage.getItem("user-items") || "[]");
  const item = userItems.find(i => i.id == itemId);
  if (!item) return alert("Item not found.");

  item.placed = true;
  item.x = item.x || Math.max(0, Math.min(Math.random() * (window.innerWidth - 100), window.innerWidth - 100));
  item.y = item.y || Math.max(0, Math.min(Math.random() * (window.innerHeight - 100), window.innerHeight - 100));
  localStorage.setItem("user-items", JSON.stringify(userItems));
  renderActiveItems();
}

// Remove item
function removeItem(itemId) {
  if (!confirm("Remove this item from the dashboard?")) return;
  const userItems = JSON.parse(localStorage.getItem("user-items") || "[]");
  const item = userItems.find(i => i.id == itemId);
  if (item) {
    item.placed = false;
    const el = document.getElementById(`dashboard-item-${itemId}`);
    if (el) el.remove();
    localStorage.setItem("user-items", JSON.stringify(userItems));
    renderActiveItems();
  }
}

// 🎨 CUSTOMIZE PANEL (Themes + Colors)
document.addEventListener("DOMContentLoaded", () => {
  const themeGrid = document.getElementById("theme-grid");
  const toggleMatrixBtn = document.getElementById("toggle-matrix");
  const applyColorsBtn = document.getElementById("apply-custom-colors");
  const bgStart = document.getElementById("bg-start");
  const bgEnd = document.getElementById("bg-end");
  const accentColor = document.getElementById("accent-color");
  const textColor = document.getElementById("text-color");
  const matrixCanvas = document.getElementById("matrix");

  const themes = {
    matrix: { start: "#000000", end: "#001000", accent: "#00ff00", text: "#00ff00", effect: "matrix" },
    "crypto-pulse": { start: "#f7931a", end: "#00aaff", accent: "#ffcc00", text: "#ffffff", effect: "pulse" },
    "neon-crypto": { start: "#00ff88", end: "#ff00ff", accent: "#00ffff", text: "#ffffff", effect: "neon" },
    "plasma-grid": { start: "#8a2be2", end: "#ff1493", accent: "#ff66ff", text: "#ffffff", effect: "plasma" },
    "particle-swarm": { start: "#ffd700", end: "#ff4500", accent: "#ff6600", text: "#111111", effect: "swarm" },
  };

  let matrixActive = false;
  let matrixInterval;

  function startMatrix() {
    if (!matrixCanvas) return;
    const ctx = matrixCanvas.getContext("2d");
    matrixCanvas.width = window.innerWidth;
    matrixCanvas.height = window.innerHeight;
    const chars = "アァイゥウエオカキクケコサシスセソ0123456789";
    const fontSize = 16;
    const columns = Math.floor(matrixCanvas.width / fontSize);
    const drops = Array(columns).fill(1);

    matrixInterval = setInterval(() => {
      ctx.fillStyle = "rgba(0,0,0,0.05)";
      ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
      ctx.fillStyle = "#0f0";
      ctx.font = fontSize + "px monospace";
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;
        ctx.fillText(text, x, y);
        if (y > matrixCanvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }, 50);
    matrixActive = true;
  }

  function stopMatrix() {
    clearInterval(matrixInterval);
    if (matrixCanvas) {
      const ctx = matrixCanvas.getContext("2d");
      ctx.clearRect(0, 0, matrixCanvas.width, matrixCanvas.height);
    }
    matrixActive = false;
  }

  function applyTheme(themeKey) {
    const t = themes[themeKey];
    if (!t) return;
    document.body.style.background = `linear-gradient(135deg, ${t.start}, ${t.end})`;
    document.body.style.color = t.text;
    document.querySelectorAll(".module").forEach(m => (m.style.borderColor = t.accent));
    localStorage.setItem("selectedTheme", themeKey);
    if (t.effect === "matrix") startMatrix();
    else stopMatrix();
    saveUserPref("theme", themeKey);
  }

  function previewTheme(themeKey) {
    const t = themes[themeKey];
    if (!t) return;
    document.body.style.transition = "background 0.6s ease";
    document.body.style.background = `linear-gradient(135deg, ${t.start}, ${t.end})`;
    document.body.style.color = t.text;
    document.querySelectorAll(".module").forEach(m => (m.style.borderColor = t.accent));
  }

  toggleMatrixBtn?.addEventListener("click", () => {
    if (matrixActive) {
      stopMatrix();
      toggleMatrixBtn.textContent = "Enable Matrix Effect";
    } else {
      startMatrix();
      toggleMatrixBtn.textContent = "Disable Matrix Effect";
    }
  });

  applyColorsBtn?.addEventListener("click", () => {
    const gradient = `linear-gradient(135deg, ${bgStart.value}, ${bgEnd.value})`;
    document.body.style.background = gradient;
    document.querySelectorAll(".module").forEach(m => (m.style.borderColor = accentColor.value));
    document.body.style.color = textColor.value;
    const colorData = {
      bgStart: bgStart.value,
      bgEnd: bgEnd.value,
      accent: accentColor.value,
      text: textColor.value
    };
    localStorage.setItem("customColors", JSON.stringify(colorData));
    saveUserPref("colors", colorData);
  });

  const savedTheme = localStorage.getItem("selectedTheme");
  if (savedTheme && themes[savedTheme]) applyTheme(savedTheme);

  const savedColors = JSON.parse(localStorage.getItem("customColors") || "{}");
  if (savedColors.bgStart) {
    bgStart.value = savedColors.bgStart;
    bgEnd.value = savedColors.bgEnd;
    accentColor.value = savedColors.accent;
    textColor.value = savedColors.text;
    document.body.style.background = `linear-gradient(135deg, ${bgStart.value}, ${bgEnd.value})`;
    document.body.style.color = savedColors.text;
    document.querySelectorAll(".module").forEach(m => (m.style.borderColor = savedColors.accent));
  }

  themeGrid?.querySelectorAll(".theme-card").forEach(card => {
    const theme = card.dataset.theme;
    card.querySelector(".apply-theme")?.addEventListener("click", () => applyTheme(theme));
    card.querySelector(".preview-theme")?.addEventListener("click", () => previewTheme(theme));
  });
});

// 🌐 GLOBAL SAVE HELPER
async function saveUserPref(key, value) {
  try {
    const res = await fetch("/games/api/user/save-preferences.php", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ key, value }),
    });
    const data = await res.json();
    console.log("Server response:", data);
  } catch (err) {
    console.error("❌ Save failed:", err);
  }
}
