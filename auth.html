<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Wallet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        .wallet-btn {
            background-color: #007bff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            width: 100%;
        }
        .wallet-btn:hover {
            background-color: #0056b3;
        }
        .status-message {
            color: #ff0000;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
    <script src="https://unpkg.com/@solana/web3.js@1.66.2/dist/solana-web3.min.js"></script>
</head>
<body>
    <div class="container">
        <h2>Connect Your Wallet</h2>
        <button id="phantom-btn" class="wallet-btn" onclick="connectWallet('phantom')">Connect Phantom</button>
        <button id="solflare-btn" class="wallet-btn" onclick="connectWallet('solflare')">Connect Solflare</button>
        <p id="status-message" class="status-message"></p>
    </div>

    <script>
        let userId = null;

        // Parse the Telegram user ID from the URL
        window.addEventListener("load", () => {
            const urlParams = new URLSearchParams(window.location.search);
            userId = urlParams.get("user_id");
            if (!userId) {
                showStatusMessage("Error: Telegram user ID not provided.");
            }
        });

        async function detectWallet(walletType) {
            return new Promise((resolve) => {
                let attempts = 0;
                const maxAttempts = 30; // 15 seconds
                const interval = setInterval(() => {
                    attempts++;
                    console.log(`Attempt ${attempts}: Checking for ${walletType} wallet...`);

                    if (walletType === "phantom") {
                        if (window.solana && (window.solana.isPhantom || window.solana)) {
                            clearInterval(interval);
                            console.log("Phantom wallet detected.");
                            resolve(window.solana);
                            return;
                        }
                    }

                    if (walletType === "solflare" && window.solflare && window.solflare.isSolflare) {
                        clearInterval(interval);
                        console.log("Solflare wallet detected.");
                        resolve(window.solflare);
                        return;
                    }

                    if (attempts >= maxAttempts) {
                        clearInterval(interval);
                        console.log(`${walletType} wallet not detected after ${maxAttempts} attempts.`);
                        resolve(null);
                    }
                }, 500);
            });
        }

        function showStatusMessage(message, isError = true) {
            const statusMessage = document.getElementById("status-message");
            statusMessage.textContent = message;
            statusMessage.style.color = isError ? "#ff0000" : "#008000";
        }

        async function connectWallet(walletType) {
            if (!userId) {
                showStatusMessage("Error: Telegram user ID not provided.");
                return;
            }

            showStatusMessage(`Connecting to ${walletType.charAt(0).toUpperCase() + walletType.slice(1)} wallet...`, false);

            let provider = await detectWallet(walletType);

            if (!provider) {
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                if (isMobile) {
                    showStatusMessage(`${walletType.charAt(0).toUpperCase() + walletType.slice(1)} wallet not detected. Copy the URL and open it in the ${walletType} app browser.`);

                    const copyButton = document.createElement("button");
                    copyButton.innerText = "Copy URL";
                    copyButton.className = "wallet-btn";
                    copyButton.onclick = () => {
                        navigator.clipboard.writeText(window.location.href);
                        showStatusMessage("URL copied to clipboard! Open it in the wallet app.", false);
                    };
                    document.getElementById("status-message").appendChild(copyButton);

                    if (walletType === "phantom") {
                        setTimeout(() => {
                            window.location.href = "https://phantom.app/ul/v1/connect";
                        }, 2000);
                    }
                    return;
                } else {
                    showStatusMessage(`${walletType.charAt(0).toUpperCase() + walletType.slice(1)} wallet not detected. Please install the wallet extension.`);
                    return;
                }
            }

            try {
                if (provider.isConnected) {
                    console.log(`${walletType} wallet already connected.`);
                } else {
                    await provider.connect();
                }

                const walletAddress = provider.publicKey.toString();
                showStatusMessage(`Connected: ${walletAddress.substring(0, 6)}...${walletAddress.slice(-4)}`, false);

                // Send the wallet address to the PythonAnywhere server
                const response = await fetch("https://yourusername.pythonanywhere.com/store_wallet", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        wallet_type: walletType,
                        wallet_address: walletAddress
                    })
                });

                if (response.ok) {
                    showStatusMessage("Wallet address stored successfully! You can now use the Buy Now button.", false);
                } else {
                    showStatusMessage("Failed to store wallet address. Please try again.");
                }
            } catch (error) {
                console.error(`${walletType} connection error:`, error);
                showStatusMessage(`Failed to connect to ${walletType.charAt(0).toUpperCase() + walletType.slice(1)} wallet: ${error.message}`);
            }
        }
    </script>
</body>
</html>
