<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MT Device Lab</title>
<link rel="stylesheet" href="kit.css"/>
<style>
  body{background:#0b1220;color:#dbeafe}
  .farm{display:flex;flex-wrap:wrap;gap:16px;padding:16px;align-items:flex-start}
  .dev{background:#020617;border:1px solid #1e3a5f;border-radius:18px;padding:10px;width:min(100%,280px)}
  .dev h3{margin:0 0 6px;font-size:12px;color:#93c5fd}
  .bezel{background:#020617;border-radius:16px;padding:8px;border:2px solid #334155}
  .bezel.watch{border-radius:50%;width:200px;height:200px;margin:0 auto}
  canvas{display:block;width:100%;background:#020617}
  .ctrl{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
</style>
</head><body>
<div class="top" style="background:#0f172a">
  <strong style="color:#60a5fa">MT Device Lab</strong>
  <nav id="nav"></nav>
  <button class="btn p" style="background:#2563eb;color:#fff;margin-left:auto" id="run">▶ Run farm</button>
  <button class="btn" id="shotall">Screenshot all</button>
  <button class="btn" id="crash">Inject crash</button>
</div>
<div class="grid" style="grid-template-columns:1fr 240px">
  <div id="farm" class="farm"></div>
  <aside class="card">
    <h3 style="margin-top:0">Rack</h3>
    <label class="row">Net <select id="net"><option>wifi</option><option>3g</option><option>off</option></select></label>
    <label class="row">GPS <input id="gps" value="-33.87,151.21"></label>
    <label class="row">Battery <input id="batt" type="range" min="1" max="100" value="92"></label>
    <p class="log" id="log">Lab idle. This is a device farm, not the IDE.</p>
  </aside>
</div>
<script src="kit.js"></script>
<script>
document.getElementById('nav').innerHTML = MT.nav('lab');
const DEVS=[
  {id:'pixel',label:'Pixel 8',w:360,h:780},
  {id:'fold',label:'Pixel Fold',w:560,h:640},
  {id:'tablet',label:'Tablet',w:720,h:480},
  {id:'watch',label:'Watch',w:192,h:192,watch:1},
  {id:'tv',label:'Android TV',w:640,h:360},
  {id:'auto',label:'Android Auto',w:700,h:240}
];
const farm=document.getElementById('farm');
const canvases=[];
function log(s){ const el=document.getElementById('log'); el.textContent = new Date().toISOString().slice(11,19)+' '+s+'\n'+el.textContent; }
function draw(c, label, t){
  const ctx=c.getContext('2d'); const w=c.width,h=c.height;
  ctx.fillStyle='#020617'; ctx.fillRect(0,0,w,h);
  const cell=Math.max(6, Math.min(w/32,h/16));
  for(let y=0;y<16;y++) for(let x=0;x<32;x++){
    const n=(x*3+y*5+t)&7;
    ctx.fillStyle=['#0b1020','#1e3a5f','#22c55e','#fbbf24','#ef4444','#38bdf8','#a78bfa','#f97316'][n];
    if(n) ctx.fillRect(x*cell,y*cell,cell-1,cell-1);
  }
  const px=(10+Math.sin(t/20)*8)*cell, py=(10+Math.abs(Math.sin(t/15))*4)*cell;
  ctx.fillStyle='#4ade80'; ctx.fillRect(px,py,cell,cell*1.2);
  ctx.fillStyle='#93c5fd'; ctx.font='12px sans-serif';
  ctx.fillText(label+'  '+document.getElementById('net').value+'  '+document.getElementById('batt').value+'%', 8, 16);
  if(document.getElementById('net').value==='off'){ ctx.fillStyle='#000a'; ctx.fillRect(0,0,w,h); ctx.fillStyle='#ef4444'; ctx.fillText('OFFLINE', 8, 32); }
}
DEVS.forEach(d=>{
  const el=document.createElement('div'); el.className='dev';
  el.innerHTML=`<h3>${d.label} · ${d.w}×${d.h}</h3><div class="bezel ${d.watch?'watch':''}"><canvas width="${d.w}" height="${d.h}"></canvas></div>
    <div class="ctrl"><button class="btn" data-id="${d.id}" data-a="shot">PNG</button><button class="btn" data-id="${d.id}" data-a="crash">Crash</button></div>`;
  farm.appendChild(el);
  canvases.push({d, c:el.querySelector('canvas')});
});
let t=0, raf=0, running=false;
function loop(){ if(!running) return; t++; canvases.forEach(x=>draw(x.c,x.d.label,t)); raf=requestAnimationFrame(loop); }
document.getElementById('run').onclick=()=>{ running=!running; document.getElementById('run').textContent=running?'■ Stop farm':'▶ Run farm'; if(running) loop(); log(running?'farm running 6 devices':'stopped'); };
document.getElementById('shotall').onclick=()=>{
  canvases.forEach(x=>x.c.toBlob(b=>MT.download(x.d.id+'.png',b,'image/png')));
  log('screenshots saved for '+canvases.length+' devices');
};
function reportCrash(device){
  const crashes=MT.get('mt-crashes',[]);
  crashes.unshift({at:Date.now(), device, message:'NullPointerException in MainActivity.onCreate', stack:'au.com.futuret3ch.made.MainActivity.onCreate(MainActivity.java:14)', gps:document.getElementById('gps').value, batt:document.getElementById('batt').value});
  MT.set('mt-crashes', crashes.slice(0,80));
  log('crash filed for '+device+' → Play Console inbox');
}
document.getElementById('crash').onclick=()=>reportCrash('farm');
farm.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const row=canvases.find(x=>x.d.id===b.dataset.id); if(!row) return;
  if(b.dataset.a==='shot') row.c.toBlob(bl=>MT.download(row.d.id+'.png',bl,'image/png'));
  if(b.dataset.a==='crash') reportCrash(row.d.label);
});
canvases.forEach(x=>draw(x.c,x.d.label,0));
</script>
</body></html>
