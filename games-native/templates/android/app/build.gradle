plugins { id 'com.android.application' }
android {
    namespace 'au.com.futuret3ch.made'
    compileSdk 34
    defaultConfig {
        applicationId 'au.com.futuret3ch.made'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
