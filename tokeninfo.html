<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token Information</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Token Information</h1>
    <div id="token-info">
        <p><strong>Name:</strong> <span id="token-name"></span></p>
        <p><strong>Symbol:</strong> <span id="token-symbol"></span></p>
        <p><strong>Price:</strong> <span id="token-price"></span></p>
        <p><strong>Total Supply:</strong> <span id="token-supply"></span></p>
        <p><strong>Market Cap:</strong> <span id="market-cap"></span></p>
        <p><strong>Total Buys:</strong> <span id="total-buys"></span></p>
        <p><strong>Total Sells:</strong> <span id="total-sells"></span></p>
        <p><strong>Total Buy Volume:</strong> <span id="total-buy-volume"></span></p>
        <p><strong>Total Sell Volume:</strong> <span id="total-sell-volume"></span></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
